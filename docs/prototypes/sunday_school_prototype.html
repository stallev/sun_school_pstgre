      if (cs[k] && k==='voice'){ confirmDialog('Отозвать согласие на запись голоса?','Новые записи станут недоступны, а все сохранённые записи голоса ребёнка будут удалены. Оценки и расшифровки останутся.','revoke-voice','Отозвать и удалить'); break; }
      cs[k] = !cs[k]; render(); toast(cs[k] ? 'Согласие дано' : 'Согласие отозвано'); break; }
    case 'revoke-voice': S.consent[S.child].voice = false; closeDialog(); render(); toast('Согласие отозвано, записи будут удалены'); break;
    case 'delete-audio': confirmDialog('Удалить все записи голоса?','Аудио удалится безвозвратно. Оценки и расшифровки сохранятся. Согласие останется в силе.','delete-audio-do','Удалить записи'); break;
    case 'delete-audio-do': closeDialog(); toast('Запрос на удаление отправлен администратору'); break;

    /* админ */
    case 'utab': S.usersTab = el.dataset.val; S.userOpen=null; render(); break;
    case 'user-toggle': S.userOpen = S.userOpen===el.dataset.id ? null : el.dataset.id; render(); break;
    case 'user-disable': { const u=USERS.find(x=>x.id===el.dataset.id); u.disabled=true; u.status='disabled'; audit('Доступ · '+u.name,'Отключён'); S.userOpen=null; render(); toast(`${u.name}: доступ отключён`); break; }
    case 'user-enable': { const u=USERS.find(x=>x.id===el.dataset.id); u.disabled=false; u.status='active'; audit('Доступ · '+u.name,'Возвращён'); S.userOpen=null; render(); toast(`${u.name}: доступ возвращён`); break; }
    case 'merge': { const u=USERS.find(x=>x.id===el.dataset.id), d=USERS.find(x=>x.id===u.dup);
      confirmDialog(`Объединить с «${d.name}»?`, `Вход через Telegram (${u.tg}) будет привязан к пользователю ${d.name}. Пользователь «${u.name}» исчезнет из списка.`, 'merge-do', 'Объединить'); S.mergeId = u.id; break; }
    case 'merge-do': { const i=USERS.findIndex(x=>x.id===S.mergeId), u=USERS[i], d=USERS.find(x=>x.id===u.dup); if(!d.prov.includes('telegram')) d.prov.push('telegram'); USERS.splice(i,1); audit('Пользователи','Объединены: '+u.name+' → '+d.name); closeDialog(); S.userOpen=null; render(); toast('Пользователи объединены'); break; }
    case 'group-edit': S.groupEdit = el.dataset.val; go('groupEdit'); break;
    case 'group-new': groupNewDialog(); break;
    case 'gs-toggle': SETTINGS[el.dataset.k].on = !SETTINGS[el.dataset.k].on; render(); break;
    case 'ptab': S.peopleTab = el.dataset.tab; render(); break;
    case 'pupil-new': pupilDialog(null); break;
    case 'pupil-edit': pupilDialog(pupil(+el.dataset.pid)); break;
    case 'enroll': enrollDialog(UNASSIGNED.find(u=>u.id===+el.dataset.id)); break;
    case 'ach-toggle': { const x = ach(el.dataset.code); if (x.code==='practice') { toast('Включится после теста распознавания'); break; } x.active = !x.active; render(); break; }
    case 'ach-edit': achDialog(el.dataset.code ? ach(el.dataset.code) : null); break;
    case 'close-year': closeYearDialog(); break;
    case 'close-year-do': S.yearClosed = true; audit('Учебный год '+YEAR,'Завершён'); closeDialog(); render(); toast(`Учебный год ${YEAR} завершён`); break;
    case 'year-new': yearNewDialog(); break;
    case 'dlg-close': closeDialog(); break;
  }
});

  if (t.dataset.lf){ S.lf[t.dataset.lf] = t.type==='checkbox' ? t.checked : t.value; if (S.lf.err[t.dataset.lf]){ delete S.lf.err[t.dataset.lf]; } }
  if (t.dataset.pk){ S.lf.picker[t.dataset.pk] = t.value; const pk=S.lf.picker; const r = pk.ch && pk.from ? `${pk.book} ${pk.ch}:${pk.from}${pk.to && pk.to!==pk.from ? '–'+pk.to : ''}` : '';
    const pv = document.getElementById('pk-preview'); if (pv) pv.innerHTML = r ? `${ref(r)} — ${VERSES[r] ? 'текст найден' : 'текст подставится из Синодального перевода'}` : 'Диапазон: «Пс. 22:1–3». Один стих — оставьте «по» пустым.'; }
});
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset.tbl){
    const lid = S.lessonId, pid = +t.dataset.pid, r = S.hc[lid][pid], k = t.dataset.tbl;
    const val = t.type==='checkbox' ? t.checked : (t.value==='' ? null : +t.value);
    const old = k.startsWith('v') ? r.v[+k.slice(1)] : r[k];
    if (k.startsWith('v')){ r.v[+k.slice(1)] = val; r.vs[+k.slice(1)] = 'manual'; } else r[k] = val;
    if (isCorrection(lid)){
      if (old==null && val!=null && k!=='present' && k!=='sing') r.late[k] = TODAY;
      audit(`Исправление в таблице · ${pupil(pid).name} · ${lessonById(lid).d}`, `${k}: ${old==null?'—':old} → ${val==null?'—':val}`);
    }
    if (!r.done){ r.done = true; }
    const fresh = isCorrection(lid) ? recalc([pid]) : [];
    render(); toast(fresh.length ? `Исправлено. Новое достижение: ${fresh.map(a=>ach(a.code).name+' · '+TIER[a.tier]).join(', ')}` : isCorrection(lid) ? 'Исправлено и записано в журнал' : `Сохранено: ${pupil(pid).name}`); return;
  }
  if (t.dataset.input==='pen-type'){ const p = t.selectedOptions[0].dataset.pts; document.getElementById('pn-q').value = p; document.getElementById('pn-hint').textContent = `По каталогу: ${p}. Меньше — можно, больше — нельзя.`; }
  if (t.dataset.input==='award-re'){ const f = t.form, [code,tier] = f.ach.value.split('|'), pts = f.ach.selectedOptions[0].dataset.pts;
    document.getElementById('aw-ev').innerHTML = evRows(+f.pid.value, code, +tier); f.pts.value = pts; document.getElementById('aw-hint').textContent = `По каталогу: ${pts}. Больше — нельзя.`; evCount(); }
  if (t.name==='ev') evCount();
  if (t.dataset.input==='group-lang'){ const g = GROUPS.find(x=>x.name===S.groupEdit); g.lang = t.value; audit('Настройки группы · '+g.name, 'Язык и перевод Библии: '+BIBLE[g.lang]); toast('Перевод группы: '+BIBLE[g.lang]); }
  if (t.dataset.input==='award-ach'){ const p = t.selectedOptions[0].dataset.pts; document.getElementById('aw-pts').value = p; document.getElementById('aw-hint').textContent = `По каталогу: ${p}. Больше — нельзя.`; }
  if (t.dataset.lf || t.dataset.pk) t.dispatchEvent(new Event('input', { bubbles:true }));

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, err = f.querySelector('[data-err]');
  const fail = msg => { if (err){ err.textContent = msg; err.classList.remove('hidden','text-muted'); err.classList.add('text-danger'); } else toast(msg); };
  if (kind==='lesson'){
    const L = S.lf; L.err = {};
    if (!L.d) L.err.d = 'Укажите дату';
    else if (L.d < '2026-09-06' || L.d > '2027-05-30') L.err.d = 'Дата вне учебного года '+YEAR;
    if (L.t.trim().length < 3) L.err.t = 'Тема — от 3 символов';
    if (!L.teacher || !groupTeachers('Средняя').includes(L.teacher)) L.err.teacher = 'Выберите учителя из назначенных на группу';
    if (L.kind!=='review' && !L.v.length) L.err.v = 'Добавьте хотя бы один золотой стих';
    if (L.kind==='review') L.v = [];
    if (Object.keys(L.err).length){ render(); document.querySelector('[data-form=lesson] .text-danger')?.scrollIntoView({ block:'center' }); return; }
    if (L.id){ const was = lessonById(L.id).teacher; Object.assign(lessonById(L.id), { kind:L.kind, test:L.kind!=='review', d:ddmm(L.d), t:L.t.trim(), teacher:L.teacher, v:L.v, content:L.content }); audit('Урок '+lessonById(L.id).n, 'Изменён'+(was!==L.teacher?`; ведёт: ${was} → ${L.teacher}`:'')); S.lessonId=L.id; toast('Урок сохранён'); }
    else { const n = Math.max(...LESSONS.map(l=>l.n))+1, id = Math.max(...LESSONS.map(l=>l.id))+1;
      LESSONS.push({ id, n, kind:L.kind, d:ddmm(L.d), t:L.t.trim(), teacher:L.teacher, v:L.v, content:L.content, test:L.kind!=='review', planned:true });
      L.v.forEach(r=>{ if(!VERSES[r]) VERSES[r]='Текст подставится из Синодального перевода.'; });
      if (L.cal){ const ex = EVENTS.find(x=>x.d===ddmm(L.d) && x.type==='lesson'); if (ex){ ex.t=`Урок ${n} · ${L.t.trim()}`; ex.lesson=id; } else EVENTS.push({ id:'e'+Date.now(), d:ddmm(L.d), type:'lesson', t:`Урок ${n} · ${L.t.trim()}`, lesson:id }); }
      S.lessonId = id; toast(L.cal ? 'Урок создан и добавлен в календарь' : 'Урок создан'); }
    go('lesson'); return;
  }
  if (kind==='issue'){
    const pid = +f.dataset.pid, q = parseInt(f.qty.value,10), bal = earned(pid)-issued(pid);
    if (!Number.isInteger(q) || q<=0) return fail('Введите целое число больше нуля');
    if (q > bal) return fail(`Нельзя выдать больше остатка (${bal})`);
    if (!f.date.value) return fail('Укажите дату выдачи');
    S.ledger.push({ id:'N'+Date.now(), pid, date:ddmm(f.date.value), qty:q, by:ME[S.role].name, note:'' });
    render(); toast(`Выдано ${q} ${plural(q,'кирпичик','кирпичика','кирпичиков')}: ${pupil(pid).name}`); return;
  }
  if (kind==='fix'){
    const pid = +f.dataset.pid, q = Math.abs(parseInt(f.qty.value,10)), note = f.note.value.trim(), orig = S.ledger.find(x=>x.id===f.dataset.id);
    if (!q) return fail('Сколько списать?');
    if (q > orig.qty) return fail(`Не больше, чем было выдано (${orig.qty})`);
    if (!note) return fail('Укажите причину — она попадёт в журнал');
    S.ledger.push({ id:'F'+Date.now(), pid, date:TODAY, qty:-q, by:ME[S.role].name, note:'Корректировка: '+note });
    audit('Кирпичики · '+pupil(pid).name, '−'+q, note); S.fixOpen = null; render(); toast('Корректировка записана'); return;
  }
  if (kind==='revoke'){
    const a = S.awarded.find(x=>x.id===f.dataset.id), reason = f.reason.value.trim();
    if (!reason) return fail('Укажите причину — она попадёт в журнал');
    a.revoked = { by:ME[S.role].name, date:TODAY, reason };
    audit('Достижение отозвано · '+pupil(a.pid).name, `${ach(a.code).name} · ${TIER[a.tier]}, −${a.pts}; уроки ${lessonsWord(a.ev)} остаются занятыми`, reason);
    closeDialog(); render(); toast('Отозвано. Пересчёт не выдаст это достижение за те же уроки.'); return;
  }
  if (kind==='penalty'){
    const pid = +f.pid.value, lid = +f.lid.value, x = pen(f.code.value), q = parseInt(f.qty.value,10), reason = f.reason.value.trim();
    if (!Number.isInteger(q) || q<1) return fail('Сколько кирпичиков снять — целое число от 1');
    if (q > -x.pts) return fail(`Не больше значения из каталога (${-x.pts})`);
    if (reason.length < 5) return fail('Опишите, что произошло: причину увидит родитель');
    if (lessonPen(pid, lid)) return fail('На этом уроке у ученика уже есть штраф. Снимите его, если нужно выдать другой.');
    S.penalties.push({ id:'P'+Date.now(), pid, code:x.code, lid, pts:-q, date:TODAY, by:ME[S.role].name, reason, off:null });
    audit('Штраф · '+pupil(pid).name, `${x.name} · урок ${lessonById(lid).n}, −${q}`, reason);
    closeDialog(); render(); toast(`${pupil(pid).name}: штраф −${q}. Оценки урока не изменились.`); return;
  }
  if (kind==='penoff'){
    const x = S.penalties.find(y=>y.id===f.dataset.id), reason = f.reason.value.trim();
    if (!reason) return fail('Укажите причину — её увидит родитель');
    x.off = { by:ME[S.role].name, date:TODAY, reason };
    audit('Штраф снят · '+pupil(x.pid).name, `${pen(x.code).name}, ${sgnInt(x.pts)} → 0`, reason);
    closeDialog(); render(); toast(`Штраф снят: ${-x.pts} ${plural(-x.pts,'кирпичик вернулся','кирпичика вернулись','кирпичиков вернулись')}`); return;
  }
  if (kind==='pencat'){
    const name = f.name.value.trim(), q = parseInt(f.pts.value,10);
    if (!name) return fail('Укажите название');
    if (!Number.isInteger(q) || q<1 || q>20) return fail('Максимум — целое число от 1 до 20');
    if (f.dataset.code){ const x = pen(f.dataset.code); audit('Каталог штрафов', `${x.name}: ${sgnInt(x.pts)} → −${q}`); Object.assign(x, { name, en:f.en.value.trim(), pts:-q }); }
    else { PEN.push({ code:'p'+Date.now(), name, en:f.en.value.trim(), pts:-q, active:true }); audit('Каталог штрафов', `Добавлен: ${name}, −${q}`); }
    closeDialog(); render(); toast('Каталог штрафов сохранён'); return;
  }
  if (kind==='award'){
    const pid = +f.pid.value, [code,t] = f.ach.value.split('|'), tier = +t, a = ach(code), max = a.tiers[tier][1], p = parseInt(f.pts.value,10), reason = f.reason.value.trim();
    const boxes = [...f.querySelectorAll('[name=ev]:checked')], ev = boxes.map(x=>+x.value).sort((x,y)=>x-y), got = boxes.reduce((s,x)=>s + +x.dataset.w, 0), need = needOf(a, tier);
    if (!Number.isInteger(p) || p<0) return fail('Баллы — целое число от 0');
    if (p > max) return fail(`Не больше значения из каталога (${max})`);
    if (got < need) return fail(code==='hundred' ? `В отмеченных уроках ${got} баллов, нужно ${need}` : `Отметьте не меньше ${need} ${plural(need,'урока','уроков','уроков')}`);
    if (ev.some(l=>claimed(pid,code,tier).includes(l))) return fail('Часть уроков уже занята этим достижением этого уровня');
    if (KIND[a.type]!=='streak' && S.awarded.some(x=>x.pid===pid && x.code===code && x.tier===tier)) return fail('Этот уровень уже выдан в этом учебном году');
    if (!reason) return fail('Укажите причину');
    S.awarded.push({ id:'M'+Date.now(), pid, code, tier, pts:p, ev, date:CURD(), src:'manual', by:ME[S.role].name, reason });
    audit('Достижение вручную · '+pupil(pid).name, `${a.name} · ${TIER[tier]}, +${p} · уроки ${lessonsWord(ev)}`, reason);
    closeDialog(); render(); toast(`${pupil(pid).name}: «${ach(code).name}», +${p}`); return;
  }
  if (kind==='event'){
    const d = f.d.value, t = f.t.value.trim(), type = f.type.value;
    if (!d) return fail('Укажите дату');
    if (!t) return fail('Укажите название');
    if (f.dataset.id){ Object.assign(EVENTS.find(x=>x.id===f.dataset.id), { d:ddmm(d), t, type, desc:f.desc.value.trim() }); toast('Событие сохранено'); }
    else { EVENTS.push({ id:'e'+Date.now(), d:ddmm(d), t, type, desc:f.desc.value.trim() }); toast('Событие добавлено'); }
    S.month = +d.split('-')[1]; audit('Календарь', (f.dataset.id?'Изменено: ':'Добавлено: ')+t); closeDialog(); render(); return;
  }
  if (kind==='roles'){
    const u = USERS.find(x=>x.id===f.dataset.id);
    const roles = [...f.querySelectorAll('[name=role]:checked')].map(x=>x.value);
    if (u.roles.includes('admin') && f.querySelector('[name=role][value=admin]').disabled) roles.includes('admin') || roles.push('admin');
    const groups = [...f.querySelectorAll('[name=group]:checked')].map(x=>x.value);
    if (roles.includes('teacher') && !groups.length) return fail('Для роли «учитель» отметьте хотя бы одну группу');
    const before = u.roles.map(r=>ROLE_NAME[r]).join(', ') || 'подписчик';
    if (!roles.length) return fail(u.status==='pending' ? 'Отметьте хотя бы одну роль — или отклоните заявку' : 'У активного пользователя должна быть хотя бы одна роль. Чтобы закрыть доступ — «Отключить доступ»');
    if (roles.includes('parent')){ const e = applyParentLink(u, f); if (e) return fail(e); }
    const approved = u.status==='pending'; if (approved){ u.status = 'active'; u.approved = TODAY; }
    u.roles = roles; u.groups = roles.includes('teacher') ? groups : [];
    audit('Роли · '+u.name, `${before} → ${roles.map(r=>ROLE_NAME[r]).join(', ') || 'подписчик'}`);
    if (approved) audit('Заявка одобрена · '+u.name, roles.map(r=>ROLE_NAME[r]).join(', '));
    S.userOpen = null; render(); toast(approved ? `${u.name}: заявка одобрена` : `${u.name}: роли сохранены`); return;
  }
  if (kind==='pupil'){ if (!f.first.value.trim() || !f.last.value.trim()) return fail('Укажите имя и фамилию'); closeDialog(); toast(f.dataset.id ? 'Карточка сохранена' : 'Ученик создан'); return; }
  if (kind==='enroll'){ const i = UNASSIGNED.findIndex(u=>u.id===+f.dataset.id); const u = UNASSIGNED.splice(i,1)[0]; audit('Состав · '+u.name, 'Зачислен: '+f.g.value.split(' ·')[0]); closeDialog(); render(); toast(`${u.name} зачислен`); return; }
  if (kind==='addpupils'){ const ids = [...f.querySelectorAll('[name=u]:checked')].map(x=>+x.value); if (!ids.length) return fail('Отметьте хотя бы одного ученика');
    ids.forEach(id=>{ const i=UNASSIGNED.findIndex(u=>u.id===id); const u=UNASSIGNED.splice(i,1)[0]; const r=REMOVED.findIndex(p=>p.id===id); PUPILS.push(r>=0 ? REMOVED.splice(r,1)[0] : { id:u.id, name:u.name, born:u.born, active:true, from:'01.11', group:'Средняя' }); audit('Состав · '+u.name,'Зачислен: Средняя'); }); closeDialog(); render(); toast(`Добавлено: ${ids.length}`); return; }
  if (kind==='group'){ if (!f.name.value.trim()) return fail('Укажите название'); if (f.a.value && f.b.value && +f.a.value > +f.b.value) return fail('Возраст «от» больше, чем «до»');
    GROUPS.push({ name:f.name.value.trim(), age:`${f.a.value||'?'}–${f.b.value||'?'} лет`, min:+f.a.value, max:+f.b.value, teachers:[], pupils:0, core:0, att:0, avg:0, check:'Уроков нет', active:true }); closeDialog(); render(); toast('Группа создана'); return; }
  if (kind==='ach'){ if (!f.name.value.trim()) return fail('Укажите название'); closeDialog(); toast('Достижение сохранено'); return; }
  if (kind==='year'){ if (!f.start.value || !f.end.value || f.start.value >= f.end.value) return fail('Проверьте даты'); closeDialog(); toast(`Год ${f.name.value} создан`); return; }
  if (kind==='verse'){ if (!f.ch.value || !f.from.value) return fail('Укажите главу и стих'); const r = `${f.book.value} ${f.ch.value}:${f.from.value}${f.to.value && f.to.value!==f.from.value?'–'+f.to.value:''}`;
    if (!VERSES[r]) VERSES[r] = 'Текст подставится из Синодального перевода.'; closeDialog(); render(); toast(`${r} добавлен`); return; }
  if (kind==='childdata'){ toast('Изменения сохранены'); return; }
});

document.addEventListener('keydown', e=>{
  if (e.key==='Escape'){ if (S.dd){ const id=S.dd; S.dd=null; renderChrome(); document.querySelector(`[data-act=dd][data-id="${id}"]`)?.focus(); return; } closeMenu(); closeDialog(); }
  if (S.view==='check' && !S.finished && !['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName) && document.getElementById('dialog').classList.contains('hidden')){
    const R = roster(S.checkLesson);
    if (e.key==='Enter'){ e.preventDefault(); savePupil(); }
    if (e.key==='ArrowRight' && S.cur<R.length-1){ S.cur++; snapCur(); render(); }
    if (e.key==='ArrowLeft' && S.cur>0){ S.cur--; snapCur(); render(); }
  }
});
document.addEventListener('pointermove', e=>{ const el = e.target.closest?.('[data-chart]'); document.querySelectorAll('[data-chart]').forEach(x=>{ if (x!==el) chartLeave(x); }); if (el) chartHover(el, e.clientX); });
document.addEventListener('pointerdown', e=>{ const el = e.target.closest?.('[data-chart]'); if (el) chartHover(el, e.clientX); });
let rT; addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(()=>{ renderChrome(); drawCharts(); }, 120); });
matchMedia('(min-width: 1024px)').addEventListener('change', m=>{ if (m.matches) closeMenu(); });

snapCur();
render();


</script>
</body>
</html>
