function loadedNs(){
  const set = new Set(['common', AREA_NS[S.role]]);
  if (!S.authed || AUTH_VIEWS.includes(S.view)) set.add('auth');
  if (ANA_VIEWS.includes(S.view)) set.add('analytics');
  return set;
}
function t(key, vars){
  const [ns, ...path] = key.split('.');
  if (typeof S!=='undefined' && S.authed!==undefined && !loadedNs().has(ns)) console.error(`[i18n] namespace «${ns}» не загружен для ${S.role}/${S.view}: ${key}`);
  let v = I18N[APP.lang][ns]; for (const p of path) v = v && v[p];
  if (v==null){ console.error('[i18n] нет ключа '+APP.lang+':'+key); return key; }
  return vars ? String(v).replace(/\{(\w+)\}/g, (_,k)=>vars[k] ?? '') : v;
}

  const present = low ? r(1) > 0.7 : r(1) > 0.14;
  return {
    present,
    v: recVerses(lid).map((_,k)=> r(k+2) > 0.48 ? 2 : r(k+2) > 0.2 ? 1 : 0),
    vs: recVerses(lid).map(()=> 'manual'),
    test: !L.test ? null : (r(9) > 0.15 ? 5 + Math.round(r(10)*5) : null),
    nb: r(11) > 0.18 ? 6 + Math.round(r(12)*4) : null,
    sing: r(13) > 0.4, comment:'', done:true, late:{}
  };
}

/* =========================================================
   ДВИЖОК ДОСТИЖЕНИЙ (achievements_spec.md, раздел 7)
   Факт = запись проверки «ученик × урок». Состояние факта для правила:
   pass — засчитан, fail — не засчитан (рвёт серию), skip — пропуск.
   ========================================================= */
const KIND = { 'Серия':'streak', 'Накопление':'accum', 'Разовое':'once' };
const inOff = d => S.achMode.off.some(p=> num(d)>=num(p.from) && (!p.to || num(d)<=num(p.to)));
function factState(code, lid, pid){
  const L = lessonById(lid), r = S.hc[lid] && S.hc[lid][pid];
  if (!L || !r || !r.done || inOff(L.d)) return ['skip',0];
  const rev = isReview(L), vals = r.v.filter(x=>x!=null);
  switch(code){
    case 'verses':   if (rev || !vals.length) return ['skip',0]; return [vals.every(x=>x===2) ? 'pass' : 'fail', 1];
    case 'notebook': if (r.nb==null) return ['skip',0]; return [r.nb>=9 ? 'pass' : 'fail', 1];
    case 'test':     if (rev || !L.test || r.test==null) return ['skip',0]; return [r.test>=8 ? 'pass' : 'fail', 1];
    case 'lessons':  return (r.nb!=null || vals.length || r.test!=null) ? ['pass',1] : ['skip',0];
    case 'first':    return vals.some(x=>x===2) ? ['pass',1] : ['skip',0];
    case 'singing':  return r.sing ? ['pass',1] : ['skip',0];
    case 'hundred':  return pts(r) > 0 ? ['pass', pts(r)] : ['skip',0];
    default:         return ['skip',0];
  }
}
const factLessons = pid => HELD.filter(l=>S.hc[l] && S.hc[l][pid]);
/* Уроки, уже занятые этим достижением этого уровня (в т. ч. отозванные и ручные выдачи) — ДС-12 */
const claimed = (pid, code, tier) => S.awarded.filter(a=>a.pid===pid && a.code===code && a.tier===tier).flatMap(a=>a.ev);
/* Чистая функция: новые выдачи для ученика. Ничего не меняет. */
function evaluate(pid){
  const out = [], has = (code,tier) => S.awarded.concat(out).some(a=>a.pid===pid && a.code===code && a.tier===tier);
  const lids = factLessons(pid);
  ACH.filter(a=>a.active).forEach(a=>{
    const kind = KIND[a.type], st = lids.map(l=>[l, ...factState(a.code, l, pid)]);
    if (kind==='streak'){
      const runs = []; let run = [];
      st.forEach(([l,s])=>{ if (s==='pass') run.push(l); else if (s==='fail'){ if (run.length) runs.push(run); run = []; } });
      if (run.length) runs.push(run);
      runs.forEach(rn=> a.tiers.forEach(([n,p],t)=>{
        if (rn.length < n) return;
        const same = S.awarded.concat(out).some(x=>x.pid===pid && x.code===a.code && x.tier===t && x.ev.some(l=>rn.includes(l)));
        if (!same) out.push({ pid, code:a.code, tier:t, pts:p, ev:rn.slice(0,n), date:lessonById(rn[n-1]).d, src:'auto' });
      }));
    } else {
      const pass = st.filter(([,s])=>s==='pass');
      a.tiers.forEach(([n,p],t)=>{
        if (kind==='once' && t>0) return;
        if (has(a.code,t)) return;
        let cum = 0; const ev = [];
        for (const [l,,w] of pass){ ev.push(l); cum += w; if (cum >= (kind==='once' ? 1 : n)) break; }
        if (cum >= (kind==='once' ? 1 : n)) out.push({ pid, code:a.code, tier:t, pts:p, ev, date:lessonById(ev[ev.length-1]).d, src:'auto' });
      });
    }
  });
  return out;
}
/* Пересчёт: записывает новые выдачи. Режим выключен — ничего не делает (ДС-14) */
function recalc(pids){
  if (!S.achMode.on) return [];
  const fresh = [];
  pids.forEach(pid=>{ evaluate(pid).forEach(a=>{
    const dup = a.ev.some(l=>claimed(pid,a.code,a.tier).includes(l));   /* страховка: уникальность (достижение, уровень, урок) */
    if (!dup){ a.id = 'A'+(++awardSeq); S.awarded.push(a); fresh.push(a); }
  }); });
  return fresh;
}

/* Проверенный урок — есть хотя бы одна проверенная запись (БП-1) */
const isChecked = lid => S.hc[lid] && Object.values(S.hc[lid]).some(r=>r.done);
function pupilStats(p){
  const ls = lessonsInPeriod().filter(isChecked);
  let nE=0, nP=0, missing=0;
  ls.forEach(l=>{ if (num(lessonById(l).d) < num(p.from||'01.09')) return; const r=S.hc[l][p.id];
    if (!r){ missing++; return; } if (r.done){ nE++; if (r.present) nP++; } });
  return { nE, nP, missing, rate: nE ? nP/nE : null };
}
function layerOf(p){
  if (!p.active) return 'C';
  const st = pupilStats(p);
  if (!st.nE) return 'D';
  return st.rate >= 0.5 ? 'A' : 'B';
}
const LAYER_TEXT = {
  A:'Явка не ниже 50% проверенных уроков после зачисления.',
  B:'Явка ниже 50% проверенных уроков после зачисления.',
  C:'Неактивный ученик — в групповую статистику не входит.',
  D:'Нет ни одного проверенного урока после даты зачисления — явку посчитать не из чего.'
};
function layers(){
  const L = { A:[], B:[], C:[], D:[] };
  PUPILS.concat(INACTIVE).forEach(p=>L[layerOf(p)].push(p));
  return L;
}
/* Стихи (БП-2): на уроке N рассказывают стихи урока N−1; нужна проверенная запись и присутствие */
function verseObs(lid, pid){
  if (!recVerses(lid).length) return null;
  const r = S.hc[lid] && S.hc[lid][pid];
  if (!r || !r.done || !r.present) return null;
  const valid = r.v.filter(x=>x!=null);
  if (!valid.length) return null;
  return { recited: valid.filter(x=>x>=1).length, slots: valid.length };
}
const recited = r => r.v.filter(x=>x>0).length;
/* Тест и тетрадь (БП-3, БП-4): проверенная запись и присутствие, либо «сдано позже» */
function scoreObs(lid, pid, k){
  const r = S.hc[lid] && S.hc[lid][pid];
  if (!r || !r.done || r[k]==null) return null;
  if (k==='test' && !lessonById(lid).test) return null;
  return (r.present || r.late[k]) ? r[k] : null;
}
function series(ids){
  return lessonsInPeriod().filter(isChecked).map(lid=>{
    const L = lessonById(lid);
    const recs = ids.map(id=>[id,S.hc[lid][id]]).filter(([,r])=>r && r.done);
    const pres = recs.filter(([,r])=>r.present).length;
    const vo = ids.map(id=>verseObs(lid,id)).filter(Boolean);
    const ts = ids.map(id=>scoreObs(lid,id,'test')).filter(v=>v!=null);
    const ns = ids.map(id=>scoreObs(lid,id,'nb')).filter(v=>v!=null);
    return {
      lid, d:L.d,
      att: recs.length ? pres/recs.length : null, present:pres, base:recs.length,
      verses: vo.length ? mean(vo.map(o=>o.recited)) : null, nV:vo.length, slots:recVerses(lid).length,
      test: ts.length ? mean(ts) : null, nTest:ts.length, testNA:!L.test,
      nb: ns.length ? mean(ns) : null, nNb:ns.length
    };
  });
}
function personal(pid){
  return lessonsInPeriod().map(lid=>{
    const L = lessonById(lid), r = S.hc[lid][pid];
    return { lid, d:L.d, t:L.t, r, has: !!(r && r.done), vo: verseObs(lid,pid), test: scoreObs(lid,pid,'test'), nb: scoreObs(lid,pid,'nb') };
  });
}
function missingRecords(){ return PUPILS.reduce((a,p)=>a+pupilStats(p).missing,0); }

/* =========================================================
   ГРАФИКИ (SVG, одна ось Y, наведение показывает значения)
   ========================================================= */
const CHARTS = {};
let chartSeq = 0;
function chart(spec){
  const key = 'c' + (++chartSeq);
  CHARTS[key] = spec;
  const rows = spec.labels.map((lb,i)=>`<tr class="border-t border-line"><td class="py-1.5 pr-4 tabular-nums">${lb}</td>${spec.series.map(s=>`<td class="py-1.5 pr-4 text-right tabular-nums">${s.values[i]==null?'—':spec.fmt(s.values[i])}</td>`).join('')}${spec.extra?`<td class="py-1.5 text-right tabular-nums text-muted">${spec.extra(i)}</td>`:''}</tr>`).join('');
  return `<div class="relative h-[${spec.h||210}px]" data-chart="${key}"></div>
    ${spec.series.length>1 ? `<div class="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-sm text-ink-2">${spec.series.map(s=>`<span class="inline-flex items-center gap-2"><span class="inline-block h-0.5 w-5 rounded-full ${s.color.replace(/var\(--color-(.+)\)/,'bg-$1')}"></span>${s.name}</span>`).join('')}</div>` : ''}
    <details class="group mt-2"><summary class="inline-flex h-9 cursor-pointer list-none items-center gap-1 rounded-md text-sm text-ink-2 hover:text-ink">${ic('i-down','size-4 transition-transform duration-150 group-open:rotate-180')} Показать таблицей</summary>
      <table class="mt-1 w-full text-sm"><thead><tr class="text-left text-muted"><th class="py-1 pr-4 font-normal">Урок</th>${spec.series.map(s=>`<th class="py-1 pr-4 text-right font-normal">${s.name}</th>`).join('')}${spec.extra?'<th class="py-1 text-right font-normal">N</th>':''}</tr></thead><tbody>${rows}</tbody></table></details>`;
}
function svgChart(spec, W){
  const H = spec.h || 210, multi = spec.series.length > 1, endLbl = multi && W >= 480 && !spec.noEnd;
  const m = { l:38, r: endLbl ? 92 : 22, t:18, b:28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.labels.length;
  const bar = spec.type==='bar';
  const x = i => bar ? m.l + (i+0.5)*iw/n : m.l + (n===1 ? iw/2 : i*iw/(n-1));
  const y = v => m.t + ih - (v - spec.min)/(spec.max - spec.min)*ih;
  const ticks = spec.ticks;
  let g = ticks.map(t=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--color-line)" stroke-width="1"/>
    <text x="${m.l-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--color-muted)">${spec.tickFmt?spec.tickFmt(t):t}</text>`).join('');
  const step = Math.ceil(n / Math.max(2, Math.floor(iw/52)));
  g += spec.labels.map((lb,i)=> (i%step===0 || i===n-1) ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--color-muted)">${lb}</text>` : '').join('');
  g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(spec.min)}" y2="${y(spec.min)}" stroke="var(--color-line-strong)" stroke-width="1"/>`;
  if (bar){
    const s = spec.series[0], bw = Math.min(26, iw/n*0.55);
    g += s.values.map((v,i)=> v==null ? '' : `<rect x="${x(i)-bw/2}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="3" fill="${v>=0 ? s.color : s.neg}"/>`).join('');
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--color-ink-2)" stroke-width="1"/>`;
  }
  if (!bar) spec.series.forEach((s,si)=>{
    let d='', pen=false;
    s.values.forEach((v,i)=>{ if (v==null){ pen=false; return; } d += (pen?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen=true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += s.values.map((v,i)=> v==null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="var(--color-surface)" stroke-width="2"/>`).join('');
    const li = s.values.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
    if (li!=null && li>=0){
      if (multi && endLbl) g += `<text x="${x(li)+8}" y="${y(s.values[li])+4}" font-size="12" fill="var(--color-ink-2)">${s.name}</text>`;
      else if (!multi) g += `<text x="${x(li)}" y="${y(s.values[li])-10}" text-anchor="middle" font-size="12" font-weight="500" fill="var(--color-ink)">${spec.fmt(s.values[li])}</text>`;
    }
  });
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--color-ink-2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" data-hit="1"/>`;
  return `<svg width="${W}" height="${H}" role="img" aria-label="${spec.aria}" class="block overflow-visible">${g}</svg>
    <div class="tip pointer-events-none absolute z-10 hidden rounded-lg bg-ink px-3 py-2 text-sm text-surface whitespace-nowrap"></div>`;
}
const chartRO = new ResizeObserver(entries=>entries.forEach(en=>{ const el=en.target; const w=Math.round(el.clientWidth); if (el._spec && w && w!==el._W){ el._W=w; el.innerHTML=svgChart(el._spec,w); } }));
function drawCharts(){
  chartRO.disconnect();
  document.querySelectorAll('[data-chart]').forEach(el=>{
    const spec = CHARTS[el.dataset.chart]; if (!spec) return;
    el._spec = spec; el._W = Math.round(el.clientWidth) || 320;
    el.innerHTML = svgChart(spec, el._W);
    chartRO.observe(el);
  });
}
function chartHover(el, clientX){
  const spec = el._spec; if (!spec) return;
  const W = el._W, multi = spec.series.length>1, m = { l:38, r: (multi && W>=480 && !spec.noEnd) ? 92 : 22 };
  const n = spec.labels.length, iw = W - m.l - m.r;
  const rx = clientX - el.getBoundingClientRect().left;
  const bar = spec.type==='bar';
  const i = Math.max(0, Math.min(n-1, bar ? Math.floor((rx - m.l) / (iw/n)) : Math.round((rx - m.l) / (n===1 ? 1 : iw/(n-1)))));
  const px = bar ? m.l + (i+0.5)*iw/n : m.l + (n===1 ? iw/2 : i*iw/(n-1));
  const xh = el.querySelector('.xh'); xh.setAttribute('x1',px); xh.setAttribute('x2',px); xh.setAttribute('visibility','visible');
  const tip = el.querySelector('.tip');
  tip.innerHTML = `<p class="font-medium">${spec.labels[i]}</p>` + spec.series.map(s=>`<p>${multi? s.name+': ' : ''}${s.values[i]==null ? 'нет данных' : spec.fmt(s.values[i])}${spec.extra && !multi && spec.extra(i) ? ' · '+spec.extra(i) : ''}</p>`).join('');
  tip.classList.remove('hidden');
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(W - tw, px - tw/2)) + 'px';
  tip.style.top = '-8px';
  tip.style.transform = 'translateY(-100%)';
}
function chartLeave(el){ el.querySelector('.xh')?.setAttribute('visibility','hidden'); el.querySelector('.tip')?.classList.add('hidden'); }

  </section>

  ${isReview(L) ? `<section class="${CARD} mt-3 p-4 sm:p-5"><h2 class="font-medium">Обзорный урок</h2>
    <p class="mt-1 text-ink-2">Золотые стихи не задаются и не рассказываются, теста нет — на проверке оцениваются тетрадь и спевка.${prev && prev.v.length ? ` Стихи урока ${prev.n} (${prev.v.map(ref).join(', ')}) расскажут на ${nxt ? 'уроке '+nxt.n : 'следующем обычном уроке'}.` : ''}</p></section>` : `
  <div class="mt-3 grid grid-cols-1 gap-3 lg:grid-cols-2">
    <section class="${CARD} p-4 sm:p-5"><h2 class="mb-3 font-medium">Задано на этот урок <span class="font-normal text-muted">· расскажут ${nxt ? 'на уроке '+nxt.n : 'на следующем обычном уроке'}</span></h2>${verseList(L.v)}</section>
    <section class="${CARD} p-4 sm:p-5"><h2 class="mb-3 font-medium">Рассказывают на этом уроке <span class="font-normal text-muted">${prev ? '· заданы на уроке '+prev.n : ''}</span></h2>${verseList(recVerses(L.id))}</section>
  </div>`}`;
}

const SEL = 'h-8 rounded-md border border-line-strong bg-surface px-1 text-sm tabular-nums focus:border-cobalt focus:outline-none';
function selOpts(max, val){ return `<option value="" ${val==null?'selected':''}>—</option>` + Array.from({length:max+1},(_,i)=>`<option ${val===i?'selected':''}>${i}</option>`).join(''); }
function vLessonTable(){
  const L = lessonById(S.lessonId), recs = S.hc[L.id] || {}, rv = recVerses(L.id), corr = isCorrection(L.id);
  const ids = Object.keys(recs).map(Number).filter(id=> (!S.lsFilter.present || recs[id].present) && (!S.lsFilter.unchecked || !recs[id].done));
  const rowCls = r => !r.done ? 'bg-warn-soft/70' : !r.present ? 'bg-paper' : '';
  const scoreCls = v => v==null ? '' : v>=8 ? 'text-ok' : v<=4 ? 'text-danger' : '';
  const ctl = (id, r) => ({
    present: `<input type="checkbox" data-tbl="present" data-pid="${id}" ${r.present?'checked':''} aria-label="Присутствие: ${pupil(id).name}" class="size-5 accent-cobalt">`,
    v: k => `<select data-tbl="v${k}" data-pid="${id}" aria-label="${rv[k]}: ${pupil(id).name}" class="${SEL} w-14">${selOpts(2, r.v[k])}</select>`,
    test: L.test ? `<select data-tbl="test" data-pid="${id}" aria-label="Тест: ${pupil(id).name}" class="${SEL} w-16 ${scoreCls(r.test)}">${selOpts(10, r.test)}</select>` : '<span class="text-xs text-muted">нет</span>',
    nb: `<select data-tbl="nb" data-pid="${id}" aria-label="Тетрадь: ${pupil(id).name}" class="${SEL} w-16 ${scoreCls(r.nb)}">${selOpts(10, r.nb)}</select>`,
    sing: `<input type="checkbox" data-tbl="sing" data-pid="${id}" ${r.sing?'checked':''} aria-label="Спевка: ${pupil(id).name}" class="size-5 accent-cobalt">`
  });
  const late = (r,k) => r.late[k] ? `<span class="block text-[0.6875rem] leading-none text-amber-ink">позже</span>` : '';
  return `${backLink('lesson','К уроку')}
  <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div><h1 class="font-display text-[1.75rem] font-medium leading-[1.1] sm:text-[2.125rem]">Сводная таблица</h1><p class="mt-1 text-ink-2">Урок ${L.n} · ${L.t} · ${L.d}</p></div>
    <button type="button" data-act="check-open" data-lid="${L.id}" class="${B_PRIMARY}">${ic('i-check','size-4')} Последовательная проверка</button>
  </div>
  ${corr ? `<p class="mb-3 flex items-start gap-2 rounded-lg bg-amber-soft px-3 py-2 text-sm">${ic('i-alert','size-4 mt-0.5 text-amber-ink')} Урок проверен. Правки пересчитают баллы и попадут в журнал, новые оценки получат отметку «сдано ${TODAY}».</p>` : ''}
  <div class="mb-3 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm">
    <label class="inline-flex items-center gap-2"><input type="checkbox" data-act="lsf" data-k="present" ${S.lsFilter.present?'checked':''} class="size-4 accent-cobalt"> Только присутствовавшие</label>
    <label class="inline-flex items-center gap-2"><input type="checkbox" data-act="lsf" data-k="unchecked" ${S.lsFilter.unchecked?'checked':''} class="size-4 accent-cobalt"> Только непроверенные</label>
    <span class="flex flex-wrap items-center gap-x-3 gap-y-1 text-muted sm:ml-auto"><span class="inline-flex items-center gap-1.5"><span class="size-3 rounded-sm bg-warn-soft ring-1 ring-line"></span>не проверен</span><span class="inline-flex items-center gap-1.5"><span class="size-3 rounded-sm bg-paper ring-1 ring-line"></span>не был</span></span>
  </div>

  <div class="${CARD} hidden overflow-x-auto md:block">
    <table class="w-full text-left text-sm">
      <thead class="border-b border-line text-muted"><tr>
        <th scope="col" class="w-12 py-2 pl-4 font-normal">№</th><th scope="col" class="py-2 pr-2 font-normal">Ученик</th><th scope="col" class="px-2 py-2 text-center font-normal">Был</th>
        ${rv.map(r=>`<th scope="col" class="px-1 py-2 text-center font-normal">${r}</th>`).join('')}
        <th scope="col" class="px-1 py-2 text-center font-normal">Тест</th><th scope="col" class="px-1 py-2 text-center font-normal">Тетрадь</th><th scope="col" class="px-2 py-2 text-center font-normal">Спевка</th>
        <th scope="col" class="px-2 py-2 text-right font-normal">Итого</th><th scope="col" class="w-10 py-2 pr-3"><span class="sr-only">Открыть</span></th></tr></thead>
      <tbody class="divide-y divide-line">
        ${ids.map((id,i)=>{ const r=recs[id], c=ctl(id,r); return `<tr class="${rowCls(r)}">
          <td class="py-1.5 pl-4 pr-2 tabular-nums text-muted">${i+1}</td>
          <td class="py-1.5 pr-2"><button type="button" data-act="pupil-open" data-pid="${id}" class="text-left font-medium text-cobalt-ink hover:underline">${pupil(id).name}</button></td>
          <td class="px-2 py-1.5 text-center">${c.present}</td>
          ${rv.map((_,k)=>`<td class="px-1 py-1.5 text-center">${c.v(k)}${late(r,'v'+k)}</td>`).join('')}
          <td class="px-1 py-1.5 text-center">${c.test}${late(r,'test')}</td>
          <td class="px-1 py-1.5 text-center">${c.nb}${late(r,'nb')}</td>
          <td class="px-2 py-1.5 text-center">${c.sing}</td>
          <td class="px-2 py-1.5 text-right font-display text-base tabular-nums">${r.done ? pts(r) : '—'}</td>
          <td class="py-1.5 pr-3 text-right"><button type="button" data-act="fix-pupil" data-lid="${L.id}" data-pid="${id}" aria-label="Открыть ${pupil(id).name} в последовательной проверке" class="inline-flex size-8 items-center justify-center rounded-md text-edit hover:bg-paper">${ic('i-edit','size-4')}</button></td></tr>`; }).join('')}
      </tbody></table>
  </div>

  <ul class="space-y-2 md:hidden">
    ${ids.map((id,i)=>{ const r=recs[id], c=ctl(id,r); return `<li class="${CARD} ${rowCls(r)} p-3">
      <div class="flex items-center gap-2"><span class="w-6 text-sm tabular-nums text-muted">${i+1}</span>
        <button type="button" data-act="pupil-open" data-pid="${id}" class="min-w-0 flex-1 truncate text-left font-medium text-cobalt-ink">${pupil(id).name}</button>
        <span class="font-display text-lg tabular-nums">${r.done ? pts(r) : '—'}</span>
        <button type="button" data-act="fix-pupil" data-lid="${L.id}" data-pid="${id}" aria-label="Открыть в последовательной проверке" class="inline-flex size-8 items-center justify-center rounded-md text-edit">${ic('i-edit','size-4')}</button></div>
      <div class="mt-2 grid grid-cols-2 gap-x-3 gap-y-2 text-sm">
        <label class="flex items-center gap-2">${c.present}<span>Был</span></label>
        <label class="flex items-center gap-2">${c.sing}<span>Спевка</span></label>
        ${rv.length ? `<div class="col-span-2 flex flex-wrap items-center gap-1.5"><span class="w-14 text-muted">Стихи</span>${rv.map((_,k)=>c.v(k)).join('')}</div>` : ''}
        <div class="flex items-center gap-2"><span class="w-14 text-muted">Тест</span>${c.test}${r.late.test?'<span class="text-xs text-amber-ink">позже</span>':''}</div>
        <div class="flex items-center gap-2"><span class="text-muted">Тетрадь</span>${c.nb}${r.late.nb?'<span class="text-xs text-amber-ink">позже</span>':''}</div>
      </div></li>`; }).join('')}
  </ul>
  <p class="mt-3 text-sm text-muted">Стихи — заданные на прошлом уроке. Итого = стихи + тест + тетрадь + спевка. Зелёным — от 8, красным — до 4 баллов.</p>`;
}

/* ---------- Проверка ДЗ (и исправление проверенного урока) ---------- */
function scoreRow(key, val, max, opts={}){
  const vals = Array.from({length:max+1},(_,i)=>i);
  const wide = max > 2;
  const grid = wide ? 'grid-cols-6 sm:grid-cols-12' : 'grid-cols-4 sm:grid-cols-[repeat(4,2.75rem)]';
  const btn = (v, label, aria) => `<button type="button" role="radio" aria-checked="${val===v}" data-act="score" data-k="${key}" data-val="${v===null?'null':v}" ${aria?`aria-label="${aria}" title="${aria}"`:''}
      class="h-10 rounded-lg border text-[0.9375rem] tabular-nums transition-[background-color,border-color,color,transform] duration-100 active:scale-[0.95] motion-reduce:active:scale-100 ${val===v ? SEG_ON+' font-bold' : SEG_OFF}">${label}</button>`;
  return `<div class="py-3 ${wide ? '' : 'sm:grid sm:grid-cols-[minmax(0,1fr)_auto] sm:items-start sm:gap-4'}">
    <div class="mb-2 min-w-0 ${wide ? '' : 'sm:mb-0 sm:pt-2'}"><div class="flex flex-wrap items-center gap-2">${opts.label}${opts.right || ''}</div>${opts.below || ''}</div>
    <div class="grid ${grid} gap-1" role="radiogroup" aria-label="${opts.aria}">${btn(null,'—','Не оценивалось')}${vals.map(v=>btn(v,v)).join('')}</div>
  </div>`;
}
function roster(lid){ return PUPILS.filter(p=>S.hc[lid] && S.hc[lid][p.id]); }
function isCorrection(lid){ return lid < CUR; }

function vCheck(){
  const lid = S.checkLesson, L = lessonById(lid), R = roster(lid), corr = isCorrection(lid), rv = recVerses(lid);
  const done = R.filter(p=>S.hc[lid][p.id].done).length;
  if (S.finished) {
    const today = S.lastNew;
    return pageHead('Проверка завершена', `Урок ${L.n} · ${L.t} · все ${R.length} учеников`) + `
    <section class="${CARD} max-w-2xl p-4 sm:p-5">
      ${S.achMode.on ? `<p class="flex items-center gap-2 text-ok">${ic('i-ok')} Достижения пересчитаны для учеников урока: новых — ${today.length}</p>
      <h2 class="${H2} mt-3">Кого отметить в воскресенье</h2>
      <ul class="mt-2 divide-y divide-line">${today.map(a=>`<li class="flex items-center gap-3 py-2.5">${tierDot(a.tier)}
        <span class="min-w-0 flex-1"><span class="block">${pupil(a.pid).name}</span><span class="block text-sm text-muted">за уроки ${lessonsWord(a.ev)}</span></span><span class="text-right text-sm text-ink-2">${ach(a.code).name} · ${TIER[a.tier]} · +${a.pts}</span></li>`).join('') || '<li class="py-2.5 text-ink-2">Новых достижений нет: серии продолжаются.</li>'}</ul>`
      : `<p class="text-ink-2">Режим достижений в группе выключен — пересчёт не запускался.</p>`}
      <div class="mt-4 flex flex-wrap gap-2">
        <button type="button" data-act="go" data-view="bricks" class="${B_PRIMARY}">${ic('i-brick','size-4')} К выдаче кирпичиков</button>
        <button type="button" data-act="lesson-table" data-lid="${lid}" class="${B_GHOST}">Сводная таблица</button>
      </div>
    </section>`;
  }
  const p = R[S.cur] || R[0], c = S.hc[lid][p.id];
  const list = R.map((q,i)=>{ const cq = S.hc[lid][q.id];
    return `<li><button type="button" data-act="pick" data-i="${i}" ${i===S.cur?'aria-current="true"':''}
      class="flex h-9 w-full items-center gap-2.5 rounded-md px-2.5 text-left text-[0.9375rem] transition-[background-color] duration-100 ${i===S.cur ? 'bg-cobalt-soft font-bold text-cobalt-ink' : 'hover:bg-paper'}">
      <span class="${cq.done ? 'text-ok' : 'text-line-strong'}">${ic(cq.done?'i-ok':'i-circle','size-4')}</span>
      <span class="flex-1 truncate">${q.name}</span>
      ${Object.keys(cq.late).length ? '<span class="text-xs text-amber-ink">позже</span>' : ''}
      ${cq.done ? `<span class="text-sm tabular-nums text-muted">${pts(cq)}</span>` : ''}</button></li>`; }).join('');
  const lateTag = k => c.late[k] ? `<span class="text-sm text-amber-ink">сдано ${c.late[k]}</span>` : '';
  const verseRows = rv.map((r,k)=>{ const voice = c.vs[k]==='voice';
    return scoreRow('v'+k, c.v[k], 2, { aria:'Стих '+r, label: ref(r),
      right: (voice ? `<span class="inline-flex items-center gap-1 text-sm text-ink-2">${ic('i-mic','size-4')} голос: 3 дня</span>` : '') + lateTag('v'+k),
      below: `<details class="group"><summary class="inline-flex h-7 cursor-pointer list-none items-center gap-1 text-sm text-ink-2 hover:text-ink">${ic('i-down','size-4 transition-transform duration-150 group-open:rotate-180')} Текст</summary>
        <p class="max-w-[52ch] font-display italic leading-snug text-ink-2">${VERSES[r]}</p></details>${voice ? '<p class="text-sm text-muted">Оценка из голосовой проверки. Ваша оценка заменит её.</p>' : ''}` }); }).join('');
  const lastNew = !corr && R.filter(q=>!S.hc[lid][q.id].done && q.id!==p.id).length===0;
  const saveLabel = corr ? 'Сохранить исправление' : lastNew ? 'Завершить проверку' : 'Сохранить и далее';
  return `${backLink('lesson','К уроку')}
  <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
    <div><h1 class="font-display text-[1.75rem] font-medium leading-[1.1] sm:text-[2.125rem]">${corr ? 'Исправление оценок' : 'Проверка ДЗ'}</h1><p class="mt-1 text-ink-2">Урок ${L.n} · ${L.t} · ${L.d}</p></div>
    <button type="button" data-act="lesson-table" data-lid="${lid}" class="${B_OUTLINE}">${ic('i-grid','size-4')} Сводная таблица</button>
  </div>
  ${corr ? `<p class="mb-4 flex items-start gap-2 rounded-lg bg-amber-soft px-3 py-2 text-sm">${ic('i-alert','size-4 mt-0.5 text-amber-ink')} Урок уже проверен. Изменения пересчитают баллы и кирпичики и попадут в журнал; новые оценки получат отметку «сдано ${TODAY}». Присутствие задним числом не меняйте.</p>`
  : `<div class="mb-4 flex items-center gap-3"><div class="flex-1">${meter(done, R.length, 'Проверено учеников')}</div><p class="shrink-0 text-sm tabular-nums text-ink-2">${done} из ${R.length}</p></div>`}
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-[16rem_minmax(0,1fr)] lg:items-start">
    <details class="${CARD} group lg:hidden">
      <summary class="flex h-11 cursor-pointer list-none items-center justify-between px-3"><span class="text-sm text-ink-2">Ученики · ${done} из ${R.length}</span>${ic('i-down','size-5 text-ink-2 transition-transform duration-150 group-open:rotate-180')}</summary>
      <ul class="space-y-0.5 border-t border-line p-1.5">${list}</ul>
    </details>
    <aside class="${CARD} hidden p-1.5 lg:sticky lg:top-6 lg:block" aria-label="Ученики"><ul class="space-y-0.5">${list}</ul></aside>

    <section class="${CARD} px-4 pb-1 sm:px-5" aria-labelledby="pupilName">
      <div class="flex items-center justify-between gap-3 border-b border-line py-3">
        <div class="min-w-0"><h2 id="pupilName" class="truncate font-display text-[1.5rem] font-medium leading-tight">${p.name}</h2>
          <p class="text-sm text-muted">${S.cur+1} из ${R.length} · ${p.born ? p.born+' г. р.' : 'данные удалены'}</p></div>
        <div class="text-right"><p class="font-display text-[1.75rem] leading-none tabular-nums">${pts({...c, done:true})}</p><p class="text-xs text-muted">баллов</p></div>
      </div>
      <div class="grid gap-3 border-b border-line py-3 sm:grid-cols-[minmax(0,1fr)_auto] sm:items-center">
        <div class="flex flex-wrap items-center gap-3"><span class="font-medium">Был на уроке</span><div class="w-56">${seg('Присутствие', [[true,'Да'],[false,'Нет']], c.present, 'present')}</div></div>
        <div class="flex items-center gap-3"><span class="font-medium">Спевка</span>${toggle(c.sing,'sing','Был на спевке')}${isReview(L) ? '<span class="text-sm text-muted">Обзорный урок: тетрадь и спевка</span>' : ''}</div>
        <p class="text-xs text-muted sm:col-span-2">Присутствие на баллы не влияет: задания можно сдать позже.</p>
      </div>
      ${rv.length ? `<p class="pt-3 text-sm text-muted">Стихи урока ${prevRegular(lid).n} — рассказывают сегодня</p><div class="divide-y divide-line border-b border-line">${verseRows}</div>` : `<p class="border-b border-line py-3 text-sm text-muted">${isReview(L) ? 'Обзорный урок: стихи не рассказывают, теста нет.' : 'На первом уроке года стихов не рассказывают.'}</p>`}
      <div class="divide-y divide-line border-b border-line">
        ${L.test ? scoreRow('test', c.test, 10, { aria:'Тест', label:'<span class="font-medium">Тест</span>', right: lateTag('test') }) : (isReview(L) ? '' : '<p class="py-3 text-sm text-muted">Тест на этом уроке не проводился.</p>')}
        ${scoreRow('nb', c.nb, 10, { aria:'Тетрадь', label:'<span class="font-medium">Тетрадь</span>', right: lateTag('nb') })}
      </div>
      <div class="py-3"><label for="cmt" class="sr-only">Комментарий учителя</label>
        <input id="cmt" data-input="comment" value="${c.comment}" class="${FIELD}" placeholder="Комментарий учителя — необязательно"></div>
      ${penRow(p.id, lid)}
      ${corr ? `<div class="flex flex-wrap items-center gap-2 border-t border-line py-3"><span class="text-sm font-medium">Причина:</span>${['Сдал позже','Ошибка ввода','Другое'].map(r=>`<button type="button" data-act="reason" data-val="${r}" aria-pressed="${S.reason===r}" class="h-8 rounded-md border px-2.5 text-sm ${S.reason===r ? SEG_ON : SEG_OFF}">${r}</button>`).join('')}</div>` : ''}
      <div class="hidden items-center justify-between gap-2 border-t border-line py-3 lg:flex">
        <button type="button" data-act="prev" class="${B_GHOST}" ${S.cur===0?'disabled':''}>${ic('i-left','size-4')} Предыдущий</button>
        <span class="hidden text-sm text-muted xl:inline">Enter — сохранить · ← → — ученики</span>
        <button type="button" data-act="save" class="${B_PRIMARY}">${saveLabel} ${corr?'':ic('i-right','size-4')}</button>
      </div>
    </section>
  </div>
  <div class="fixed inset-x-0 bottom-0 z-20 border-t border-line bg-surface/90 px-4 pt-2.5 pb-[max(0.625rem,env(safe-area-inset-bottom))] backdrop-blur-md reduce-transparency:bg-surface reduce-transparency:backdrop-blur-none lg:hidden">
    <div class="flex gap-2">
      <button type="button" data-act="prev" class="${B_OUTLINE} w-12 px-0" aria-label="Предыдущий ученик" ${S.cur===0?'disabled':''}>${ic('i-left')}</button>
      <button type="button" data-act="save" class="${B_PRIMARY} flex-1">${saveLabel}</button>
      ${corr ? `<button type="button" data-act="next" class="${B_OUTLINE} w-12 px-0" aria-label="Следующий ученик">${ic('i-right')}</button>` : ''}
    </div>
  </div>`;
}

/* ---------- Моя группа (состав) ---------- */
function vGroup(){
  const list = PUPILS;
  return pageHead('Моя группа', `Средняя · 9–11 лет · ${list.length} ${plural(list.length,'ученик','ученика','учеников')} · ведут Павел Ким и Елена Гусева`,
    `<button type="button" data-act="add-pupils" class="${B_OUTLINE}">${ic('i-plus','size-4')} Добавить учеников</button>`) + achModeCard() + `
  <div class="${CARD}">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-line px-5 py-3">
      <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" data-act="sel-all" ${S.groupSel.length===list.length?'checked':''} class="size-4 accent-cobalt"> Выбрать всех</label>
      <button type="button" data-act="remove-pupils" class="${B_DANGER} h-9 px-3 text-sm" ${S.groupSel.length?'':'disabled'}>Исключить выбранных${S.groupSel.length?' ('+S.groupSel.length+')':''}</button>
    </div>
    <ul class="divide-y divide-line">${list.map(p=>{ const st=pupilStats(p); const lay=layerOf(p);
      return `<li class="flex items-center gap-3 px-5 py-3">
        <input type="checkbox" data-act="sel" data-pid="${p.id}" ${S.groupSel.includes(p.id)?'checked':''} aria-label="Выбрать ${p.name}" class="size-4 shrink-0 accent-cobalt">

      ${bp || pp ? `<p class="mt-1 text-sm text-muted">в том числе${bp ? ` бонус +${bp}` : ''}${bp && pp ? ',' : ''}${pp ? ` <span class="text-penalty">штрафы ${sgnInt(pp)}</span>` : ''}</p>` : ''}
      ${bal<0 ? `<p class="mt-2 text-sm text-danger">Остаток ушёл в минус после выдачи: исправили оценку или выдали штраф. Разница погасится будущими баллами — у ребёнка ничего не забираем.</p>` : ''}
      <form data-form="issue" data-pid="${p.id}" class="mt-2.5 grid grid-cols-2 gap-2 sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] sm:items-end" novalidate>
        <div><label for="q${p.id}" class="mb-1 block text-xs font-medium text-ink-2">Количество</label>
          <input id="q${p.id}" name="qty" inputmode="numeric" value="${bal>0?bal:''}" ${bal<=0?'disabled':''} class="${FIELD} tabular-nums disabled:opacity-45"></div>
        <div><label for="d${p.id}" class="mb-1 block text-xs font-medium text-ink-2">Дата</label>
          <input id="d${p.id}" name="date" type="date" value="2026-10-31" max="2026-10-31" ${bal<=0?'disabled':''} class="${FIELD} disabled:opacity-45"></div>
        <button class="${B_PRIMARY} col-span-2 sm:col-span-1" ${bal<=0?'disabled':''}>Выдать</button>
        <p class="col-span-2 hidden text-sm text-danger sm:col-span-3" data-err></p>
      </form>
      <details class="group mt-2" ${S.bricksOpen===p.id?'open':''}>
        <summary data-act="bricks-hist" data-pid="${p.id}" class="flex h-8 cursor-pointer list-none items-center justify-between text-sm font-medium">История выдачи (${hist.length})${ic('i-down','size-4 text-ink-2 transition-transform duration-150 group-open:rotate-180')}</summary>

              <span class="flex-1 text-ink-2">${h.date} · ${h.by}</span>
              ${h.qty>0 ? `<button type="button" data-act="fix-open" data-id="${h.id}" data-pid="${p.id}" class="inline-flex h-7 items-center gap-1 rounded-md px-1.5 text-ink-2 hover:bg-paper hover:text-ink">${ic('i-undo','size-4')} Исправить</button>` : ''}
            </div>
            ${h.note ? `<p class="mt-0.5 text-muted">${h.note}</p>` : ''}
            ${S.fixOpen===h.id ? `<form data-form="fix" data-id="${h.id}" data-pid="${p.id}" class="mt-2 grid gap-2 sm:grid-cols-[5.5rem_minmax(0,1fr)_auto]" novalidate>

const TYPE_META = { lesson:['i-book','Урок','text-cobalt'], trip:['i-trip','Выезд','text-ok'], cancel:['i-cancel','Отмена','text-danger'] };
function vCalendar(){
  const canEdit = S.role !== 'parent';
  const month = S.month, mName = month===10 ? 'Октябрь' : 'Ноябрь';
  const first = month===10 ? 3 : 6, days = month===10 ? 31 : 30;
  const cells = []; for (let i=0;i<first;i++) cells.push(null); for (let d=1; d<=days; d++) cells.push(d); while (cells.length % 7) cells.push(null);
  const evs = EVENTS.filter(e=>Math.floor(num(e.d)/100)===month).sort((a,b)=>num(a.d)-num(b.d));
  const ds = d => String(d).padStart(2,'0')+'.'+month;
  return pageHead(`${mName} 2026`, S.role==='parent' ? 'Средняя группа · только просмотр' : 'Средняя группа',
    `<div class="flex gap-1"><button type="button" data-act="month" data-val="10" aria-label="Октябрь" class="${B_OUTLINE} w-11 px-0" ${month===10?'disabled':''}>${ic('i-left','size-4')}</button>
     <button type="button" data-act="month" data-val="11" aria-label="Ноябрь" class="${B_OUTLINE} w-11 px-0" ${month===11?'disabled':''}>${ic('i-right','size-4')}</button></div>
     ${canEdit ? `<button type="button" data-act="event-new" class="${B_PRIMARY}">${ic('i-plus','size-4')} Событие</button>` : ''}`) + `
  <div class="grid grid-cols-1 gap-6 xl:grid-cols-[minmax(0,1.6fr)_minmax(0,1fr)]">
    <div class="${CARD} min-w-0 p-2 sm:p-4">
      <div class="grid grid-cols-7 text-center text-xs text-muted sm:text-sm">${['пн','вт','ср','чт','пт','сб','вс'].map(d=>`<div class="py-2">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-px overflow-hidden rounded-lg bg-line">
        ${cells.map(d=>{ const ev = d && EVENTS.find(e=>e.d===ds(d)); const m = ev && TYPE_META[ev.type]; const today = month===10 && d===31;
          const inner = d ? `<span class="inline-flex size-7 items-center justify-center rounded-full text-sm tabular-nums ${today ? 'bg-ink text-surface' : ''}">${d}</span>
            ${ev ? `<span class="mt-0.5 flex items-center gap-1 ${m[2]}">${ic(m[0],'size-4')}<span class="hidden truncate text-xs sm:inline">${m[1]}</span></span>` : ''}` : '';
          return d && (canEdit || ev) ? `<button type="button" data-act="${ev ? 'event-edit' : 'event-new'}" ${ev ? `data-id="${ev.id}"` : `data-date="${ds(d)}"`} class="flex min-h-14 flex-col items-start justify-start bg-surface p-1 text-left hover:bg-paper sm:min-h-24 sm:p-2" aria-label="${d} ${mName.toLowerCase()}${ev?': '+ev.t:''}">${inner}</button>`
            : `<div class="min-h-14 p-1 sm:min-h-24 sm:p-2 ${d?'bg-surface':'bg-paper'}">${inner}</div>`; }).join('')}
      </div>
      <div class="mt-3 flex flex-wrap gap-x-5 gap-y-2 px-1 text-sm text-ink-2">${Object.values(TYPE_META).map(([i,l,c])=>`<span class="inline-flex items-center gap-1.5"><span class="${c}">${ic(i,'size-4')}</span>${l}</span>`).join('')}</div>
    </div>
    <section class="min-w-0">
      <h2 class="${H2} mb-3">События месяца</h2>
      <ul class="${CARD} divide-y divide-line">
        ${evs.map(e=>{ const m=TYPE_META[e.type]; return `<li><button type="button" data-act="event-edit" data-id="${e.id}" class="flex w-full items-center gap-4 px-5 py-3.5 text-left hover:bg-paper/70">
          <span class="w-10 shrink-0 font-display text-xl tabular-nums">${e.d.slice(0,2)}</span><span class="${m[2]}">${ic(m[0])}</span>
          <span class="min-w-0 flex-1"><span class="block">${e.t}</span><span class="block text-sm text-muted">${m[1]}${e.desc?' · '+e.desc:''}</span></span></button></li>`;}).join('') || '<li class="px-5 py-4 text-sm text-muted">Событий нет</li>'}
      </ul>
    </section>
  </div>`;
}

function periodChips(){
  return `<div class="flex flex-wrap gap-2" role="radiogroup" aria-label="Период">${[['year','Учебный год'],['oct','Октябрь'],['sep','Сентябрь']].map(([v,l])=>`<button type="button" role="radio" aria-checked="${S.period===v}" data-act="period" data-val="${v}"
    class="h-9 rounded-lg border px-3 text-sm ${S.period===v ? SEG_ON : SEG_OFF}">${l}</button>`).join('')}</div>`;
}
function pupilTable(list, cols){
  return `<div class="${CARD} overflow-x-auto"><table class="w-full min-w-[40rem] text-left">
    <thead class="border-b border-line text-sm text-muted"><tr>${cols.map((c,i)=>`<th scope="col" class="${i?'px-3 text-right':'px-5'} py-3 font-normal">${c[0]}</th>`).join('')}</tr></thead>
    <tbody class="divide-y divide-line">${list.map(p=>`<tr>${cols.map((c,i)=>`<td class="${i?'px-3 text-right tabular-nums':'px-5'} py-3">${i ? c[1](p) : `<button type="button" data-act="pupil-open" data-pid="${p.id}" class="text-left font-medium hover:text-cobalt">${p.name}</button>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function personalAvgs(pid){
  const rows = personal(pid).filter(x=>x.has);
  const all = personal(pid);
  const vs = all.filter(x=>x.vo).map(x=>x.vo.recited);
  const ts = all.map(x=>x.test).filter(v=>v!=null);
  const ns = all.map(x=>x.nb).filter(v=>v!=null);
  return { v:mean(vs), nV:vs.length, t:mean(ts), nT:ts.length, n:mean(ns), nN:ns.length };
}
function groupCharts(ser){
  const labels = ser.map(s=>s.d);
  const c = (title, note, spec) => `<section class="${CARD} min-w-0 p-5"><h3 class="font-display text-lg font-medium">${title}</h3><div class="mt-4">${chart(spec)}</div><p class="mt-2 text-sm text-muted">${note}</p></section>`;
  return `<div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-6">
    ${c('Посещаемость по урокам','Доля присутствовавших от основной выборки на этот урок. Число детей — в подсказке.',
      { labels, series:[{ name:'Посещаемость', color:'var(--color-series-1)', values:ser.map(s=>s.att) }], min:0, max:1, ticks:[0,0.25,0.5,0.75,1], tickFmt:t=>Math.round(t*100)+'%', fmt:v=>pct(v), extra:i=>`${ser[i].present} из ${ser[i].base}`, aria:'Посещаемость по урокам' })}
    ${c('Золотые стихи за урок','Стихи урока N рассказывают на уроке N+1 — точка стоит на нём. Первый урок года не участвует. Рассказан — оценка 1 или 2, только при присутствии.',
      { labels, series:[{ name:'Стихов', color:'var(--color-series-1)', values:ser.map(s=>s.verses) }], min:0, max:3, ticks:[0,1,2,3], fmt:v=>f1(v), extra:i=> ser[i].slots ? `N=${ser[i].nV}` : isReview(lessonById(ser[i].lid)) ? 'обзорный урок' : 'стихов ещё не задавали', aria:'Среднее число рассказанных стихов' })}
    ${c('Средний балл теста','Оценки при присутствии на проверенном уроке и «сдано позже». Пропуск точки — тест не проводился.',
      { labels, series:[{ name:'Тест', color:'var(--color-series-1)', values:ser.map(s=>s.test) }], min:0, max:10, ticks:[0,5,10], fmt:v=>f1(v), extra:i=> ser[i].testNA ? 'не проводился' : 'N='+ser[i].nTest, aria:'Средний балл теста' })}
    ${c('Средний балл тетради','Оценки при присутствии и «сдано позже». «Не оценивалось» в среднее не входит.',
      { labels, series:[{ name:'Тетрадь', color:'var(--color-series-1)', values:ser.map(s=>s.nb) }], min:0, max:10, ticks:[0,5,10], fmt:v=>f1(v), extra:i=>'N='+ser[i].nNb, aria:'Средний балл тетради' })}
  </div>`;
}

function vAnalytics(){
  if (S.anaGroup !== 'Средняя') return pageHead(t('analytics.title'), `${S.anaGroup} группа`, '') + (S.role==='admin'?groupChips():'') + `<p class="${CARD} max-w-xl p-5 text-ink-2">В прототипе подробные данные есть только у Средней группы.</p>`;

  const ser = series(ids);
  const attA = mean(A.map(p=>pupilStats(p).rate));
  const all = A.map(p=>personalAvgs(p.id));
  const nObs = k => all.reduce((a,x)=>a+x[k],0);
  const avgOf = (k) => { const v = all.map(x=>x[k]).filter(x=>x!=null); return mean(v); };
  const cohorts = [...new Set(A.filter(p=>p.born).map(p=>p.born))].sort().map(y=>{ const ps=A.filter(p=>p.born===y); const av=ps.map(p=>personalAvgs(p.id));
    return { y, n:ps.length, att:mean(ps.map(p=>pupilStats(p).rate)), v:mean(av.map(a=>a.v).filter(x=>x!=null)), t:mean(av.map(a=>a.t).filter(x=>x!=null)), nb:mean(av.map(a=>a.n).filter(x=>x!=null)) }; });
  return pageHead(t('analytics.title'), `Средняя группа · ${S.period==='year' ? 'учебный год '+YEAR : S.period==='oct' ? 'октябрь' : 'сентябрь'} · ${ser.length} ${plural(ser.length,'урок','урока','уроков')}`, periodChips()) + `

const maxPts = lid => recVerses(lid).length*2 + (lessonById(lid).test ? 10 : 0) + 10 + 1;
function progress(pid){
  const empty = r => !r.present && r.test==null && r.nb==null && r.v.every(x=>x==null) && !r.sing;
  const rows = HELD.map(lid=>{ const r = S.hc[lid] && S.hc[lid][pid]; return { lid, d:lessonById(lid).d, v: r && r.done && !empty(r) ? pts(r)/maxPts(lid)*100 : null }; });
  const pts_ = rows.filter(x=>x.v!=null);
  rows.forEach(x=>{ if (x.v==null){ x.ma=null; return; } const i = pts_.indexOf(x); const w = pts_.slice(Math.max(0,i-2), i+1); x.ma = mean(w.map(y=>y.v)); });
  let prev = null; rows.forEach(x=>{ x.delta = (x.ma!=null && prev!=null) ? x.ma - prev : null; if (x.ma!=null) prev = x.ma; });
  const last = pts_.slice(-6);
  let slope = null;
  if (last.length >= 4){ const n=last.length, xs=last.map((_,i)=>i), ys=last.map(y=>y.v), mx=mean(xs), my=mean(ys);
    slope = xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0) / xs.reduce((a,x)=>a+(x-mx)**2,0); }
  const verdict = slope==null ? ['idle','Мало данных для тренда'] : slope > 1 ? ['up','Растёт'] : slope < -1 ? ['down','Снижается'] : ['flat','Стабильно'];
  return { rows, slope, verdict };
}
const sgn = v => (v>0?'+':v<0?'−':'') + f1(Math.abs(v));
function progressBlock(pid, parent=false){
  const P = progress(pid), labels = P.rows.map(x=>x.d);
  const [k, word] = P.verdict;
  const tone = { up:'text-ok', down:'text-danger', flat:'text-ink', idle:'text-muted' }[k];
  const icon = { up:'i-chart', down:'i-alert', flat:'i-ok', idle:'i-circle' }[k];
  const tip = parent
    ? (k==='down' ? 'Если что-то мешает учёбе, поговорите с учителем — вместе проще найти, чем помочь.' : k==='up' ? 'Хорошая динамика — стоит отметить это вместе с ребёнком.' : 'Без сравнения с другими детьми: только его собственный путь.')
    : 'Нормированный балл урока (% от максимума этого урока), скользящее среднее по 3 урокам, тренд — наклон по 6 последним урокам.';
  const bars = P.rows.map(x=>x.delta);
  const lim = Math.max(4, Math.ceil(Math.max(...bars.filter(v=>v!=null).map(Math.abs), 0)));
  return `<section class="${CARD} p-4 sm:p-5">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div><h2 class="${H2}">Динамика успеваемости</h2><p class="mt-1 max-w-[62ch] text-sm text-ink-2">${tip}</p></div>
      <div class="text-right"><p class="inline-flex items-center gap-1.5 font-bold ${tone}">${ic(icon,'size-4')}${word}</p>
        ${P.slope!=null ? `<p class="text-sm tabular-nums text-ink-2">${sgn(P.slope)} п.п. за урок</p>` : ''}</div>
    </div>
    <div class="mt-4 grid grid-cols-1 gap-5 lg:grid-cols-2">
      <div class="min-w-0"><h3 class="text-sm font-medium">Балл за урок, % от максимума</h3>
        ${chart({ h:190, labels, series:[
          { name:'За урок', color:'var(--color-silver)', values:P.rows.map(x=>x.v==null?null:Math.round(x.v)) },
          { name:'Среднее за 3 урока', color:'var(--color-series-1)', values:P.rows.map(x=>x.ma==null?null:Math.round(x.ma*10)/10) }],
          noEnd:true, min:0, max:100, ticks:[0,50,100], tickFmt:t=>t+'%', fmt:v=>f1(v)+'%', aria:'Нормированный балл за урок и скользящее среднее' })}</div>
      <div class="min-w-0"><h3 class="text-sm font-medium">Изменение за урок, п.п. <span class="font-normal text-muted">(производная среднего)</span></h3>
        ${chart({ h:190, type:'bar', labels, series:[{ name:'Изменение', color:'var(--color-series-1)', neg:'var(--color-series-2)', values:bars.map(v=>v==null?null:Math.round(v*10)/10) }],
          min:-lim, max:lim, ticks:[-lim,0,lim], tickFmt:t=>(t>0?'+':'')+t, fmt:v=>sgn(v)+' п.п.', aria:'Изменение скользящего среднего от урока к уроку' })}
        <p class="mt-1 flex gap-4 text-xs text-ink-2"><span class="inline-flex items-center gap-1.5"><span class="size-2.5 rounded-sm bg-series-1"></span>рост</span><span class="inline-flex items-center gap-1.5"><span class="size-2.5 rounded-sm bg-series-2"></span>снижение</span></p></div>
    </div>
  </section>`;
}

/* Невыученные стихи прошедших уроков (ВП-16): стих урока L рассказывают на следующем обычном уроке */
function debts(pid){
  const out = [];
  LESSONS.filter(L=>!L.planned && !isReview(L) && L.v.length && nextRegular(L.id) && nextRegular(L.id).id <= CUR).forEach(L=>{
    const nx = nextRegular(L.id), rec = S.hc[nx.id] && S.hc[nx.id][pid];
    const items = L.v.map((r,k)=>({ r, k, score: rec && rec.done ? rec.v[k] : null, late: rec && rec.late['v'+k], days: practiceDays(L.id, r).length }));
    const open = items.filter(x=>x.score==null || x.score<2);
    if (open.length) out.push({ L, items, learned: items.length-open.length, open:open.length });
  });
  return out.sort((a,b)=>num(b.L.d)-num(a.L.d));
}

const DEL_ST = { new:['warn','Новый'], work:['info','В работе'], done:['ok','Выполнен'], rejected:['danger','Отклонён'], cancelled:['idle','Отменён'] };

const dayOf = d => { const [dd,mm] = d.split('.').map(Number); return Math.round(new Date(mm>=9?2026:2027, mm-1, dd).getTime()/864e5); };

/* План выполнения (УД-8): что удалим, что обезличим, предупреждения */
function delPlan(r){
  if (r.type==='account'){
    const u = userBy(r.subj), nm = u.name, mine = FAMILIES.filter(f=>f.adults.some(a=>a.user===u.id));
    const mention = arr => arr.filter(x=>x===nm).length;
    const auth = S.audit.filter(a=>a[1]===nm || a.join(' ').includes(nm)).length + mention(S.ledger.map(x=>x.by)) + mention(S.penalties.map(x=>x.by)) + mention(S.awarded.map(x=>x.by)) + LESSONS.filter(l=>l.teacher===nm).length;
    const warn = [];
    mine.forEach(f=>{ if (!f.adults.some(a=>a.user!==u.id && (a.phone || a.email))) warn.push(`Семья ${f.name}: не останется взрослого с контактами (СМ-9)`); });
    if ((u.groups||[]).length && u.roles.includes('teacher')) warn.push(`Ведёт группы в ${YEAR}: ${u.groups.join(', ')} — назначьте замену до выполнения`);
    if (u.roles.includes('admin') && USERS.filter(x=>x.roles.includes('admin') && x.status==='active').length<=1) warn.push('Это последний администратор — выполнить нельзя (УД-9)');
    return { del:[['Способы входа', u.prov.length], ['Email и Telegram', (u.email?1:0)+(u.tg?1:0)], ['ФИО', 1], ['Роли и назначения', u.roles.length + (u.groups||[]).length]],
      anon:[['Записи, где он автор (уроки, проверки, выдачи, журнал)', auth], ...mine.map(f=>['Запись в семье '+f.name+' → «взрослый (данные удалены)»', 1]), ['Согласие на обработку ПД и заявка', 2]], warn, block: warn.some(w=>w.includes('последний')) };
  }
  /* Данные ребёнка — полное удаление (УД-7, решение 31): обезличиваем только ссылки в журнале */
  const pid = r.subj, p = pupil(pid), recs = HELD.map(l=>S.hc[l] && S.hc[l][pid]).filter(Boolean);
  const nm = p ? p.name : '', first = nm.split(' ')[0];
  const fam = famOfKid(pid), gs = fam ? fam.adults : [];
  const aud = S.audit.filter(a=>nm && a.join(' ').includes(nm)).length;
  return { del:[['Карточка: ФИО, дата рождения, фото, мед. данные', p ? 1 : 0], ['Записи проверок: присутствие и все оценки', recs.length], ['Достижения с доказательствами', S.awarded.filter(a=>a.pid===pid).length],
      ['Штрафы', S.penalties.filter(x=>x.pid===pid).length], ['Журнал кирпичиков ребёнка', S.ledger.filter(x=>x.pid===pid).length], ['Голосовые попытки: аудио и транскрипты', pid===1 ? 9 : 0],
      ['Зачисление, членство в семье, согласия', 1 + (fam ? 1 : 0) + 1]],
    anon:[['Записи журнала изменений: ссылка → «ребёнок (данные удалены)», значения стёрты', aud]],
    warn:[...(gs.length>1 ? [`В семье ${fam.name} ${gs.length} взрослых — остальные получили уведомление о запросе`] : []), 'Групповые средние и графики за прошлые уроки пересчитаются без этого ребёнка'], block:false };
}
const renameAll = (from, to) => {
  if (!from) return;
  S.audit.forEach(a=>{ for (let k=1;k<a.length;k++) a[k] = String(a[k]).split(from).join(to); });
  [S.ledger, S.penalties, S.awarded].forEach(arr=>arr.forEach(x=>{ if (x.by===from) x.by = to; if (x.off && x.off.by===from) x.off.by = to; }));
  LESSONS.forEach(l=>{ if (l.teacher===from) l.teacher = to; });
  GROUPS.forEach(g=>{ g.teachers = g.teachers.map(t=>t===from ? to : t); });
};
const KID_GONE = 'ребёнок (данные удалены)';
S.kidsDeleted = [];
function executeDel(r){
  const pl = delPlan(r), n = pl.del.reduce((s,x)=>s+x[1],0), m = pl.anon.reduce((s,x)=>s+x[1],0);
  if (r.type==='account'){
    const u = userBy(r.subj), old = u.name, nn = 'Удалённый пользователь №'+(++anonSeq);
    FAMILIES.forEach(f=>f.adults.filter(a=>a.user===u.id).forEach(a=>{ renameAll(a.fio, 'взрослый (данные удалены)'); Object.assign(a, { fio:'взрослый (данные удалены)', phone:'', email:'', user:null }); }));
    renameAll(old, nn);
    Object.assign(u, { name:nn, fio:null, email:'', tg:'', prov:[], roles:[], groups:[], guardian:null, status:'deleted', disabled:false, consent: u.consent && { ...u.consent, anon:true } });
  } else {
    const pid = r.subj, p = pupil(pid);
    if (p){
      const old = p.name, first = old.split(' ')[0];
      /* журнал: ссылка на ребёнка → «ребёнок (данные удалены)», старое/новое значение стираем */
      S.audit.forEach(a=>{ if (a.join(' ').includes(old)){ for (let k=1;k<a.length;k++) a[k] = String(a[k]).split(old).join(KID_GONE); a[3] = ''; a[4] = ''; } });
      FAMILIES.forEach(f=>{ f.kids = f.kids.filter(k=>k!==pid); });
      HELD.forEach(l=>{ if (S.hc[l]) delete S.hc[l][pid]; });
      S.awarded = S.awarded.filter(a=>a.pid!==pid); S.penalties = S.penalties.filter(x=>x.pid!==pid); S.ledger = S.ledger.filter(x=>x.pid!==pid);
      const i = PUPILS.findIndex(x=>x.id===pid); if (i>=0) PUPILS.splice(i,1);
      GONE.push({ id:pid, name:KID_GONE, born:null, gone:true, group:'—' });
      delete KID_CONSENT[pid];
    }
    r.kidName = KID_GONE; S.kidsDeleted.push(TODAY);
  }
  Object.assign(r, { status:'done', done:TODAY, doneBy:ME[S.role].name, summary: r.type==='account' ? `удалено записей: ${n} · обезличено: ${m}` : `удалено записей: ${n} · ссылок в журнале обезличено: ${m}` });
  audit('Запрос на удаление выполнен · '+(r.type==='account'?'учётная запись':'данные ребёнка'), subjName(r)+' · '+r.summary);
}

function delAskDialog(type, subj){
  const kid = type==='pupil';
  openDialog(dlgHead(kid ? 'Удалить данные ребёнка?' : 'Удалить учётную запись?', kid ? KIDS[subj] || (pupil(subj)||{}).name : 'Запрос уйдёт администратору школы') + `

function delRunDialog(r){

/* ---------- События ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a==='user-open'){ closeDialog(); S.userId = el.dataset.id; go('userProfile'); }
  if (a==='deltab'){ S.delTab = el.dataset.val; render(); }
  if (a==='del-ask') delAskDialog(el.dataset.type, el.dataset.type==='pupil' ? +el.dataset.subj : el.dataset.subj);
  if (a==='del-cancel'){ const r = DEL_REQS.find(x=>x.id===el.dataset.id); r.status='cancelled'; r.cancelled=TODAY; audit('Запрос на удаление отменён автором', subjName(r)); render(); toast('Запрос отменён. Данные остаются.'); }
  if (a==='del-take'){ const r = DEL_REQS.find(x=>x.id===el.dataset.id); r.status='work'; r.taken=ME[S.role].name; audit('Запрос на удаление взят в работу', subjName(r)); render(); }
  if (a==='del-run') delRunDialog(DEL_REQS.find(x=>x.id===el.dataset.id));
  if (a==='del-reject'){ const r = DEL_REQS.find(x=>x.id===el.dataset.id); reasonDialog('delreject', r.id, 'Отклонить запрос?', subjName(r), 'Отклонить'); }
  if (a==='kid-decline'){ const id = +el.dataset.id; confirmDialog('Не давать согласие?', 'Без согласия школа не может вести данные ребёнка в приложении. Администратор свяжется с вами; если согласие так и не будет дано, данные ребёнка удалят. Вы можете дать согласие позже на этой же странице.', 'dlg-close', 'Понятно'); }
  if (a==='kid-withdraw'){ const id = +el.dataset.id; S.kidWithdraw = id;
    confirmDialog('Отозвать согласие на данные ребёнка?', 'Других действующих согласий у ребёнка нет, поэтому отзыв создаст запрос на полное удаление его данных: карточки, оценок, посещаемости, достижений, кирпичиков и записей голоса. До выполнения запрос можно отменить.', 'kid-withdraw-do', 'Отозвать и запросить удаление'); }
  if (a==='kid-withdraw-do'){ const id = S.kidWithdraw; if (!reqFor('pupil', id)){ const r = { id:'D'+Date.now(), type:'pupil', subj:id, by:meId(), date:TODAY, status:'new', reason:'Отозвано согласие на обработку данных ребёнка' }; if (!pupil(id)) r.kidName = KIDS[id]; DEL_REQS.push(r); audit('Согласие на данные ребёнка отозвано', subjName(r), 'создан запрос на полное удаление'); }
    closeDialog(); render(); toast('Согласие отозвано, создан запрос на удаление. Его можно отменить до выполнения.'); }
  if (a==='paper-consent') paperConsentDialog(+el.dataset.id);
  if (a==='reject-open'){ const u = userBy(el.dataset.id); reasonDialog('reject', u.id, 'Отклонить заявку?', fioTxt(u.fio), 'Отклонить заявку'); }
});
document.addEventListener('change', e=>{ if (e.target.dataset.input==='rg-ok') document.getElementById('rg-send').disabled = !e.target.checked; });
document.addEventListener('submit', e=>{
  const f = e.target, kind = f.dataset.form, err = f.querySelector('[data-err]');
  const fail = msg => { if (err){ err.textContent = msg; err.classList.remove('hidden'); } else toast(msg); };
  const nameOk = v => /^[A-Za-zА-Яа-яЁёІіЎў' -]{1,50}$/.test(v);
  if (kind==='register' || kind==='fio'){
    const l = f.l.value.trim(), fn = f.f.value.trim(), m = f.m.value.trim();
    if (!l || !fn) return fail(t('auth.err_name'));
    if (![l,fn].every(nameOk) || (m && !nameOk(m))) return fail(t('auth.err_chars'));
    const u = kind==='fio' ? userBy(f.dataset.id) : meU(), before = fioTxt(u.fio);
    if (kind==='register' && !f.ok.checked) return fail(t('auth.err_consent'));
    u.fio = { l, f:fn, m }; u.name = fn+' '+l;
    if (kind==='register'){ u.consent = { v:CONSENT_V, at:TODAY }; u.status = 'pending'; u.sent = TODAY; delete u.reject;
      audit('Заявка на доступ · '+u.name, 'Согласие v'+CONSENT_V+' дано, заявка отправлена'); S.view = 'pending'; render(); toast(t('auth.sent_toast')); return; }
    if (u.id!==meId()) audit('ФИО изменено администратором · '+u.name, before+' → '+fioTxt(u.fio));
    render(); toast(t('auth.saved')); return;
  }
  if (kind==='kidconsent'){ if (!f.ok.checked) return fail('Отметьте согласие, чтобы продолжить'); const id = +f.dataset.id; S.consent[id].data = true; audit('Согласие на данные ребёнка · '+KIDS[id], 'Дано в приложении, версия 1.0'); S.view = 'child'; render(); toast('Согласие сохранено'); return; }
  if (kind==='paperconsent'){ const g = f.g.value.trim(), w = f.w.value.trim(); if (!g || !w) return fail('Укажите опекуна и где хранится оригинал'); const id = +f.dataset.id;
    KID_CONSENT[id] = { how:'paper', by:g, at:ddmm(f.d.value), v:'1.0', where:w }; audit('Бумажное согласие опекуна · '+((UNASSIGNED.find(x=>x.id===id)||pupil(id)||{}).name||''), g+' · '+ddmm(f.d.value)+' · '+w); closeDialog(); render(); toast('Согласие отмечено — ребёнка можно зачислить'); return; }
  if (kind==='settings'){ const lang = f.lang.value; if (lang!==APP.lang){ audit('Настройки приложения', 'Язык интерфейса: '+LANG_NAME[APP.lang]+' → '+LANG_NAME[lang]); APP.lang = lang; } render(); toast(t('admin.st_saved', { lang:LANG_NAME[lang] })); return; }
  if (kind==='delask'){
    const subj = f.dataset.type==='pupil' ? +f.dataset.subj : f.dataset.subj;
    const r = { id:'D'+Date.now(), type:f.dataset.type, subj, by:meId(), date:TODAY, status:'new', reason:f.reason.value.trim() };
    if (r.type==='pupil' && !pupil(subj)) r.kidName = KIDS[subj];
    DEL_REQS.push(r); audit('Запрос на удаление · '+(r.type==='account'?'учётная запись':'данные ребёнка'), subjName(r), r.reason);
    closeDialog(); render(); toast('Запрос отправлен. До выполнения его можно отменить.'); return;
  }
  if (kind==='delrun'){
    if (f.c.value.trim().toLowerCase()!=='удалить') return fail('Введите слово «удалить»');
    const r = DEL_REQS.find(x=>x.id===f.dataset.id); executeDel(r); closeDialog(); S.delTab='done'; render(); toast('Выполнено: '+r.summary); return;
  }
  if (kind==='delreject' || kind==='reject'){
    const reason = f.reason.value.trim(); if (reason.length < 5) return fail('Опишите причину — её увидит пользователь');
    if (kind==='delreject'){ const r = DEL_REQS.find(x=>x.id===f.dataset.id); r.status='rejected'; r.rejected={ by:ME[S.role].name, date:TODAY, reason }; audit('Запрос на удаление отклонён', subjName(r), reason); }
    else { const u = userBy(f.dataset.id); u.status='rejected'; u.reject={ by:ME[S.role].name, date:TODAY, reason }; S.userOpen=null; audit('Заявка отклонена · '+u.name, '', reason); }
    closeDialog(); render(); toast(kind==='reject' ? 'Заявка отклонена. Пользователь увидит причину.' : 'Запрос отклонён'); return;
  }
});

const FTYPES = [['мать','Мать'],['отец','Отец'],['опекун','Опекун']];
const famById = id => FAMILIES.find(f=>f.id===id);
const famOfKid = k => FAMILIES.find(f=>f.kids.includes(k));

const kidsTxt = f => f.kids.map(k=>kidName(k).split(' ')[0]).join(', ') || 'нет детей';
const allKids = () => PUPILS.map(p=>p.id).concat(UNASSIGNED.map(u=>u.id));
const kidsWithoutFamily = () => allKids().filter(k=>!famOfKid(k));
/* Подсказка: взрослый без учётной записи, у которого совпал email или ФИО (2.4) */
function matchAdult(u){
  const fio = u.fio ? (u.fio.f+' '+u.fio.l).trim().toLowerCase() : '';
  for (const f of FAMILIES) for (const a of f.adults){
    if (a.user) continue;
    if ((u.email && a.email && a.email===u.email) || (fio && a.fio.toLowerCase()===fio)) return { f, a, by: u.email && a.email===u.email ? 'email' : 'ФИО' };
  }
  return null;
}

/* Применить выбор (вызывается из обработчика формы ролей). Возвращает текст ошибки или null */
function applyParentLink(u, f){
  const mode = (f.querySelector('[name=fmode]:checked')||{}).value || 'none';
  const typeOk = (fam, type) => type==='опекун' || !fam.adults.some(a=>a.type===type && a.user!==u.id);
  if (mode==='none') return famsOfUser(u.id).length ? null : 'Для роли «родитель» свяжите пользователя с детьми через семью';
  if (mode==='link'){ if (!f.adult.value) return 'Нет взрослых без учётной записи — выберите другой способ';
    const [fid, aid] = f.adult.value.split('|'), fam = famById(fid), a = fam.adults.find(x=>x.id===aid);
    a.user = u.id; a.email = a.email || u.email || ''; audit('Семья '+fam.name, `Учётная запись ${u.name} связана со взрослым «${a.fio}» (${a.type})`); return null; }
  if (mode==='join'){ if (!f.kid.value) return 'Выберите ребёнка'; const fam = famById(f.kid.value), type = f.jtype.value;
    if (fam.adults.some(a=>a.user===u.id)) return 'Пользователь уже взрослый этой семьи';
    if (!typeOk(fam, type)) return `В семье ${fam.name} уже есть «${type}» — у семьи одна мать и один отец (СМ-3)`;
    fam.adults.push({ id:'a'+Date.now(), fio:u.name, type, phone:'', email:u.email||'', user:u.id }); audit('Семья '+fam.name, `Добавлен взрослый: ${u.name} (${type})`); return null; }
  const kids = [...f.querySelectorAll('[name=newkid]:checked')].map(x=>/^\d+$/.test(x.value) ? +x.value : x.value);
  if (!kids.length) return 'Отметьте хотя бы одного ребёнка для новой семьи';
  if (kids.some(k=>famOfKid(k))) return 'Ребёнок уже в семье — добавьте пользователя в его семью';
  const name = f.fname.value.trim(); if (!name) return 'Укажите название семьи';
  const fam = { id:'f'+Date.now(), name, address:'', note:'', created:TODAY, adults:[{ id:'a'+Date.now(), fio:u.name, type:f.ntype.value, phone:'', email:u.email||'', user:u.id }], kids };
  FAMILIES.push(fam); audit('Семья '+name, `Создана при одобрении заявки ${u.name}: ${kids.map(kidName).join(', ')}`); return null;
}

/* ---------- События ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, f = el.dataset.id && famById(el.dataset.id);
  if (a==='family-open'){ closeDialog(); S.familyId = el.dataset.id; go('family'); }
  if (a==='family-new') familyDialog(null, el.dataset.kid);
  if (a==='family-edit') familyDialog(f);
  if (a==='adult-new') adultDialog(f, null);
  if (a==='adult-edit') adultDialog(f, f.adults.find(x=>x.id===el.dataset.aid));
  if (a==='adult-remove'){ const ad = f.adults.find(x=>x.id===el.dataset.aid); S.famRm = { f:f.id, aid:ad.id };
    confirmDialog('Исключить из семьи?', `${ad.fio} перестанет быть взрослым семьи ${f.name}${ad.user ? ' и потеряет доступ к её детям' : ''}.${f.adults.length===1 ? ' Это последний взрослый: согласия на данные детей получить будет не у кого.' : ''}`, 'adult-remove-do', 'Исключить'); }
  if (a==='adult-remove-do'){ const fam = famById(S.famRm.f), i = fam.adults.findIndex(x=>x.id===S.famRm.aid), ad = fam.adults.splice(i,1)[0]; audit('Семья '+fam.name, 'Исключён взрослый: '+ad.fio); closeDialog(); render(); toast('Исключён из семьи'); }
  if (a==='kid-add') kidAddDialog(f);
  if (a==='kid-remove'){ const k = /^\d+$/.test(el.dataset.kid) ? +el.dataset.kid : el.dataset.kid; S.famRm = { f:f.id, kid:k };
    confirmDialog('Исключить ребёнка из семьи?', `${kidName(k)} перестанет быть виден взрослым семьи ${f.name}. Без семьи у ребёнка нет взрослых, которые могут дать согласие на его данные.`, 'kid-remove-do', 'Исключить'); }
  if (a==='kid-remove-do'){ const fam = famById(S.famRm.f); fam.kids = fam.kids.filter(x=>x!==S.famRm.kid); audit('Семья '+fam.name, 'Исключён ребёнок: '+kidName(S.famRm.kid)); closeDialog(); render(); toast('Ребёнок исключён из семьи'); }
  if (a==='family-del'){ const i = FAMILIES.findIndex(x=>x.id===el.dataset.id); const fam = FAMILIES.splice(i,1)[0]; audit('Семья '+fam.name, 'Удалена'); S.peopleTab='families'; go('people'); toast('Семья удалена'); }
});

  if (kind==='family'){ const name = f.name.value.trim(); if (!name) return fail('Укажите название');
    if (f.dataset.id){ const fam = famById(f.dataset.id); Object.assign(fam, { name, address:f.address.value.trim(), note:f.note.value.trim() }); audit('Семья '+name, 'Изменены данные семьи'); closeDialog(); render(); toast('Сохранено'); return; }

    const fam = { id:'f'+Date.now(), name, address:f.address.value.trim(), note:f.note.value.trim(), created:TODAY, adults:[], kids: kid!=null ? [kid] : [] };
    FAMILIES.push(fam); audit('Семья '+name, 'Создана вручную'); closeDialog(); S.familyId = fam.id; go('family'); toast('Семья создана. Добавьте взрослого'); return; }
  if (kind==='adult'){ const fam = famById(f.dataset.id), fio = f.fio.value.trim(), type = f.type.value; if (!fio) return fail('Укажите ФИО');
    if (type!=='опекун' && fam.adults.some(x=>x.type===type && x.id!==f.dataset.aid)) return fail(`В семье уже есть «${type}» — одна мать и один отец (СМ-3)`);

const needOf = (a, t) => KIND[a.type]==='once' ? 1 : a.tiers[t][0];
const STATE_TXT = { pass:['text-ok','засчитан'], fail:['text-warn','не засчитан'], skip:['text-muted','нет оценки'] };
function evRows(pid, code, tier){
  const a = ach(code), need = needOf(a, tier), used = claimed(pid, code, tier), hundred = code==='hundred';
  const done = KIND[a.type]!=='streak' && S.awarded.find(x=>x.pid===pid && x.code===code && x.tier===tier);
  if (done) return `<p class="rounded-lg bg-paper px-3 py-2.5 text-sm text-ink-2">Этот уровень уже выдан ${done.date} (за уроки ${lessonsWord(done.ev)}). Накопительные и разовые достижения — один раз за учебный год.</p><p id="aw-cnt" class="hidden"></p>`;
  const rows = factLessons(pid).map(l=>{ const [st,w] = factState(code, l, pid); return { l, st, w, used: used.includes(l) }; });
  const pick = []; let cum = 0;
  for (const r of rows.slice().reverse()){ if (cum >= need) break; if (r.st==='pass' && !r.used){ pick.push(r.l); cum += hundred ? r.w : 1; } }
  const by = l => { const x = S.awarded.find(y=>y.pid===pid && y.code===code && y.tier===tier && y.ev.includes(l)); return x ? `${TIER[x.tier]}${x.src==='manual'?' вручную':''} от ${x.date}` : ''; };
  return `<ul class="divide-y divide-line rounded-lg border border-line">${rows.slice().reverse().map(r=>{ const L = lessonById(r.l), [c,t] = STATE_TXT[r.st];
    return `<li><label class="flex items-center gap-3 px-3 py-2 ${r.used ? 'text-muted' : 'cursor-pointer'}">
      <input type="checkbox" name="ev" value="${r.l}" data-w="${hundred ? r.w : 1}" ${pick.includes(r.l)?'checked':''} ${r.used?'disabled':''} class="size-4 shrink-0 accent-cobalt">
      <span class="w-12 tabular-nums">${L.d}</span><span class="min-w-0 flex-1 truncate text-sm text-ink-2">урок ${L.n}${isReview(L)?' · обзорный':''}</span>
      <span class="shrink-0 text-right text-sm ${r.used ? 'text-muted' : c}">${r.used ? 'занят: '+by(r.l) : t + (hundred && r.w ? ' · '+r.w : '')}</span></label></li>`; }).join('')}</ul>
    <p id="aw-cnt" class="mt-1.5 text-sm text-ink-2"></p>`;
}

let toastT;

  const t = document.getElementById('toast'); t.textContent = msg; t.classList.replace('opacity-0','opacity-100');

function openMenu(){
  const d = document.getElementById('drawer'); d.classList.remove('hidden');

const audit = (what, chg, why='') => S.audit.unshift([TODAY+' '+new Date().toTimeString().slice(0,5), ME[S.role].name, what, chg, why]);

/* ---------- Проверка: открыть / сохранить ---------- */
function openCheck(lid, pid){
  S.checkLesson = lid; S.finished = false; S.reason = '';
  const R = roster(lid);
  S.cur = pid ? R.findIndex(p=>p.id===pid) : Math.max(0, R.findIndex(p=>!S.hc[lid][p.id].done));
  snapCur(); go('check');
}
function snapCur(){ const R = roster(S.checkLesson); const p = R[S.cur]; S.snap = p ? JSON.parse(JSON.stringify(S.hc[S.checkLesson][p.id])) : null; }
function savePupil(){
  const lid = S.checkLesson, R = roster(lid), p = R[S.cur], c = S.hc[lid][p.id];
  if (isCorrection(lid)){
    const o = S.snap, changes = [];
    const fld = (k, label, a, b) => { if (a!==b){ changes.push(`${label}: ${a==null?'—':a} → ${b==null?'—':b}`); if (a==null && b!=null) c.late[k] = TODAY; } };
    fld('nb','Тетрадь',o.nb,c.nb); fld('test','Тест',o.test,c.test); c.v.forEach((v,k)=>fld('v'+k, recVerses(lid)[k], o.v[k], v));
    if (o.sing!==c.sing) changes.push(`Спевка: ${o.sing?'да':'нет'} → ${c.sing?'да':'нет'}`);
    if (o.present!==c.present) changes.push(`Присутствие: ${o.present?'был':'не был'} → ${c.present?'был':'не был'}`);
    if (o.comment!==c.comment) changes.push('Комментарий');
    if (!changes.length){ toast('Изменений нет'); return; }
    audit(`Исправление · ${p.name} · ${lessonById(lid).d}`, changes.join('; '), S.reason);
    const fresh = recalc([p.id]);
    snapCur(); render();
    if (fresh.length) { toast(`Исправлено. Новое достижение: ${fresh.map(a=>ach(a.code).name+' · '+TIER[a.tier]).join(', ')}`); return; }
    toast(Object.keys(c.late).length ? `Исправлено. Оценка засчитана как «сдано ${TODAY}», кирпичики пересчитаны.` : 'Исправлено и записано в журнал');
    return;
  }
  c.done = true;
  const next = R.findIndex((q,i)=>i>S.cur && !S.hc[lid][q.id].done), any = R.findIndex(q=>!S.hc[lid][q.id].done);
  if (next >= 0) S.cur = next; else if (any >= 0) S.cur = any;
  else { S.finished = true;
    S.lastNew = recalc(R.map(q=>q.id));
    toast(S.achMode.on ? `Проверка завершена. Новых достижений: ${S.lastNew.length}` : 'Проверка завершена'); }
  if (!S.finished) toast(`Сохранено: ${p.name}`);
  snapCur(); render(); window.scrollTo({ top:0, behavior:'auto' });
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el && S.dd && !e.target.closest('[role=menu]')){ S.dd = null; renderChrome(); }
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  const lid = S.checkLesson, R = roster(lid), c = R[S.cur] && S.hc[lid][R[S.cur].id];
  if (a!=='dd' && S.dd){ S.dd = null; renderChrome(); }
  switch(a){
    case 'dd': S.dd = S.dd===el.dataset.id ? null : el.dataset.id; renderChrome(); document.querySelector(`[data-act=dd][data-id="${el.dataset.id}"]`)?.focus(); break;
    case 'menu-open': openMenu(); break;
    case 'menu-close': closeMenu(); break;
    case 'role': S.role = el.dataset.role; S.dd = null; S.view = FIRST_VIEW[S.role]; render(); closeMenu(); toast('Вы смотрите как: ' + ROLE_NAME[S.role]); break;
    case 'go': closeDialog(); if (el.dataset.tab) S.peopleTab = el.dataset.tab; if (el.dataset.view==='analytics' && S.role==='teacher') S.anaGroup='Средняя'; if (el.dataset.view==='check' && S.view!=='check') { openCheck(CUR); break; } go(el.dataset.view); break;
    case 'toast': toast(el.dataset.msg); break;
    case 'noop': el.parentElement.querySelectorAll('[role=radio]').forEach(b=>{ const on=b===el; b.setAttribute('aria-checked',on); b.className = b.className.replace(on?SEG_OFF:SEG_ON, on?SEG_ON:SEG_OFF); }); break;
    case 'login': { const g = el.dataset.prov==='google', id = 'u'+Date.now();
      USERS.push({ id, name:g ? 'Андрей Кузнецов' : 'Андрей', fio:{ l:g ? 'Кузнецов' : '', f:'Андрей', m:'' }, email:g ? 'a.kuznetsov@gmail.com' : '', tg:g ? '' : '@andrey_k', prov:[el.dataset.prov], roles:[], status:'registration', consent:null, first:TODAY, last:'сегодня' });
      S.authed = true; S.role='subscriber'; S.guestId = id; S.view='register'; render(); toast(`Вы вошли через ${g?'Google':'Telegram'}. Заполните регистрацию`); break; }
    case 'logout': S.authed = false; render(); break;
    case 'lang': S.lang = el.dataset.val; render(); if (S.lang==='en') toast('Английский интерфейс появится после перевода словаря'); break;

    /* уроки */
    case 'lesson-open': closeDialog(); S.lessonId = +el.dataset.lid; S.lsFilter = { present:false, unchecked:false }; go('lesson'); break;
    case 'lesson-new': S.lf = { id:null, kind:'regular', d:'2026-11-08', t:'', teacher:(groupTeachers('Средняя').includes(ME[S.role].name) ? ME[S.role].name : ''), v:[], content:'', cal:true, picker:{ book:'Исх.', ch:'', from:'', to:'' }, err:{} }; go('lessonForm'); break;
    case 'lesson-edit': { const L = lessonById(+el.dataset.lid); S.lf = { id:L.id, kind:L.kind, d:isoOf(L.d), t:L.t, teacher:L.teacher, v:[...L.v], content:L.content, cal:true, picker:{ book:'Исх.', ch:'', from:'', to:'' }, err:{} }; go('lessonForm'); break; }
    case 'lf-del': S.lf.v.splice(+el.dataset.i,1); render(); break;
    case 'lf-add': { const pk = S.lf.picker;
      if (!pk.ch || !pk.from){ toast('Укажите главу и стих'); break; }
      if (pk.to && +pk.to < +pk.from){ toast('«По» должно быть не меньше «с»'); break; }
      const r = `${pk.book} ${pk.ch}:${pk.from}${pk.to && pk.to!==pk.from ? '–'+pk.to : ''}`;
      if (S.lf.v.includes(r)){ toast('Этот стих уже добавлен'); break; }
      S.lf.v.push(r); S.lf.picker = { book:pk.book, ch:'', from:'', to:'' }; delete S.lf.err.v; render(); break; }
    case 'lsf': S.lsFilter[el.dataset.k] = el.checked; render(); break;
    case 'lesson-table': closeDialog(); S.lessonId = +el.dataset.lid; S.lsFilter = { present:false, unchecked:false }; go('lessonTable'); break;
    case 'lesson-del': confirmDialog('Удалить урок?', 'Урок ещё не проверялся, поэтому удаление безопасно. Событие в календаре останется — удалите его отдельно, если нужно.', 'lesson-del-do', 'Удалить урок'); S.delLid = +el.dataset.lid; break;
    case 'lesson-del-do': { const i = LESSONS.findIndex(l=>l.id===S.delLid); const L = LESSONS.splice(i,1)[0]; audit('Урок '+L.n, 'Удалён: '+L.t); closeDialog(); go('lessons'); toast('Урок удалён'); break; }
    case 'bricks-hist': S.bricksOpen = el.parentElement.open ? null : +el.dataset.pid; break;

    /* проверка */
    case 'check-open': openCheck(+el.dataset.lid); break;
    case 'fix-pupil': openCheck(+el.dataset.lid, +el.dataset.pid); break;
    case 'pick': S.cur = +el.dataset.i; snapCur(); render(); document.getElementById('pupilName')?.scrollIntoView({ block:'start', behavior: reduceMotion() ? 'auto':'smooth' }); break;
    case 'present': c.present = el.dataset.val==='true'; render(); break;
    case 'score': { const k = el.dataset.k, v = el.dataset.val==='null' ? null : +el.dataset.val;
      if (k.startsWith('v')) { const i=+k.slice(1); c.v[i]=v; c.vs[i]='manual'; } else c[k]=v; render(); break; }
    case 'sing': c.sing = !c.sing; render(); break;
    case 'reason': S.reason = el.dataset.val; render(); break;
    case 'save': savePupil(); break;
    case 'prev': if (S.cur>0){ S.cur--; snapCur(); render(); } break;
    case 'next': if (S.cur<R.length-1){ S.cur++; snapCur(); render(); } break;

    /* группа учителя */
    case 'sel': { const id=+el.dataset.pid; S.groupSel = el.checked ? [...S.groupSel,id] : S.groupSel.filter(x=>x!==id); render(); break; }
    case 'sel-all': S.groupSel = el.checked ? PUPILS.map(p=>p.id) : []; render(); break;
    case 'add-pupils': addPupilsDialog(); break;
    case 'remove-pupils': removePupilsDialog(); break;
    case 'remove-do': { const n=S.groupSel.length; S.groupSel.forEach(id=>{ const i=PUPILS.findIndex(p=>p.id===id); const p=PUPILS.splice(i,1)[0]; REMOVED.push(p); UNASSIGNED.push({ id:p.id, name:p.name, born:p.born, note:'Исключён из Средней '+TODAY }); audit(`Состав · ${p.name}`,'Исключён из группы Средняя'); }); S.groupSel=[]; closeDialog(); render(); toast(`Исключено: ${n}. История сохранена.`); break; }

    /* аналитика */
    case 'pupil-open': closeDialog(); S.pupilId = +el.dataset.pid; go('pupil'); break;
    case 'period': S.period = el.dataset.val; render(); break;
    case 'ana-group': S.anaGroup = el.dataset.val; render(); break;

    /* кирпичики */
    case 'bricks-toggle': { const id=+el.dataset.pid; S.bricksOpen = S.bricksOpen===id ? null : id; S.fixOpen=null; render(); break; }
    case 'fix-open': S.fixOpen = S.fixOpen===el.dataset.id ? null : el.dataset.id; S.bricksOpen = +el.dataset.pid; render(); break;
    case 'award-open': if (!S.achMode.on){ toast('Режим достижений выключен в настройках группы'); break; } awardDialog(el.dataset.pid ? +el.dataset.pid : null); break;

      S.rec.state='rec'; S.rec.t=0; render();

      break;
    case 'rec-stop':
      clearInterval(S.rec.timer); S.rec.state='proc'; render();
      setTimeout(()=>{
        const r = S.rec, days = practiceDays(r.lid, r.verse), debt = r.lid < CUR;
        r.quality = debt ? 91 : 81; r.missed = debt ? [] : ['сострадательны,','во','Христе'].filter(w=>VERSES[r.verse].includes(w));
        r.dup = days.some(d=>d[0]==='сб'); r.completed = 0; r.showText = false;
        if (!r.dup && r.quality >= 80) days.push(['сб', r.quality]);
        if (debt && days.length >= NEED()){
          const nx = nextRegular(r.lid), rec = nx && S.hc[nx.id] && S.hc[nx.id][1], k = lessonById(r.lid).v.indexOf(r.verse);
          if (rec && k>=0 && (rec.v[k]==null || rec.v[k] < 2)){
            r.completed = 2 - (rec.v[k]||0); rec.v[k] = 2; rec.vs[k] = 'voice'; rec.late['v'+k] = TODAY;
            audit(`Голосовая проверка · Миша Смирнов · ${r.verse}`, `Стих урока ${lessonById(r.lid).n} выучен позже: +${r.completed}`);
          }

    case 'rec-reset': S.rec.state='idle'; S.rec.showText=false; render(); break;

    case 'consent':
